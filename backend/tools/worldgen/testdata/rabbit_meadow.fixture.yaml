# rabbit_meadow.fixture.yaml — the LIVE 500×500 by-species ecosystem: the surrounding
# wilds of the (future) medieval village, seeded with every flora + fauna TYPE so the live
# world is a full ecosystem, not an empty meadow. No agents yet — the village emerges later.
#
# terrain{random:true} materializes a 68×59 flat-top hex offset GenerateTerrain layout
# (@ cell_size 5, navmap.OffsetDimsOf) from the run seed — elevation-noise + flow-accumulation
# hydrology (sea/lakes/dendritic rivers/mountains, WG1-a) + per-cell elevation (3D height) +
# a water-proximity initial climate moisture seed. Same seed ⇒ same map (POST /api/restart),
# new seed ⇒ new map (POST /api/regen).
#
# flora_density / animal_density then populate procedurally at materialize time (SC4,
# backend/tools/worldgen/density.go): count = round(density · 250,000 unit²).
#   - flora sites are weighted by §6 carrying-capacity (dry_shrub → dry ground, tall_grass →
#     wet, none on water/steep).
#   - animals are filtered by terrain passability (F18 allow-list): fish land ONLY in water
#     (rivers/lakes — sparse here, so few fish), land species avoid deep sea.
# Densities are the same per-area ecological ratios as village_ecosystem (herbivores ≫
# predators); actual placed ≤ nominal (suitability/passability rejection).
#
# The minimal 4-grass + 1-rabbit world (pos-less-on-soil, respawn override) lives on as
# testdata/minimal_meadow.fixture.yaml for the focused materialization/respawn tests.

schema_version: 1
seed: 20260707
cell_size: 5.0   # finer terrain/path/render hexes; 500/5 ⇒ 68×59 hexes. Perception (spatial_hash_cell=12) unchanged.

bounds:
  min: [0.0, 0.0]
  max: [500.0, 500.0]

terrain:
  random: true

# ── Flora by type (6 species) — ground cover dense, trees/shrubs sparse ───────────────
flora_density:
  grass:       0.004     # ~1000 nominal — primary ground cover on fertile flats
  tall_grass:  0.0015    # ~375 — wetter ground (high-moisture §6)
  wildflower:  0.0012    # ~300 — meadow flowers
  berry_shrub: 0.0008    # ~200 — forage shrubs
  dry_shrub:   0.0006    # ~150 — establishes only on DRY ground ((1−moisture) §6)
  oak:         0.0004    # ~100 — sparse forest canopy
  waterweed:   0.010     # PD5b aquatic forage. High NOMINAL count because density placement
                         # rejection-samples: its carrying capacity is 0 on land, so every slot
                         # that lands outside water is skipped. Water is scarce on this map, so a
                         # large nominal is what actually puts weed in the few ponds/rivers.

# ── Fauna by type (6 species) — herbivores ≫ predators; fish confined to water ────────
# 육상 6종 밀도 4배 (2026-07-19, 사람 승인). 이전 밀도에서 이 월드는 **포식이 0이었다** — 6000틱 동안 사냥 0회,
# 포식자는 아사→리스폰을 반복. 원인은 행동이 아니라 산수였다: 못 먹은 포식자는 약 1게임일(1440틱)에 죽고 틱당
# ~0.2 units 움직이므로 평생 탐색 예산이 수백 units인데, 500×500 맵에서 피식자는 100~200u 떨어져 뭉쳐 있었고
# 냄새는 ~20u까지만 간다. 실측: 포식자가 피식자 30u 이내에 있던 시간 **2.0%**. (후각 반경을 3.5배로 늘려도
# 2.0→2.4%로 무의미 — 냄새장 자체가 그만큼 안 퍼진다.) 4배 후 **66.8%**, 사냥 0→6~9회/6000틱.
# 기준값의 근거: 튜닝이 실제로 작동하는 predator_balance 베드의 피식자 밀도(4.2e-4/unit²)에 맞춤(이 월드는 1.1e-4였다).
# **fish는 제외** — 물 면적은 그대로라 4배는 과밀이 될 뿐이고, 이번 결정의 근거(육상 포식자가 무리를 못 찾음)와 무관.
animal_density:
  rabbit: 0.00024        # ~15 — abundant small grazer
  deer:   0.00012        # ~8 — mid grazer
  goat:   0.00008        # ~5 — climber grazer (mountain)
  fish:   0.00004        # ~10 nominal — WATER only (rivers/lakes) after passability filter
  wolf:   0.000032       # ~2 — pack predator
  bear:   0.000016       # ~1 — apex omnivore

# Sustain the placed populations (F9 respawn tops up toward target; ≈ nominal placed counts).
# fish is water-gated: respawnPos now rejection-samples for F18 passability (engine/world/respawn.go)
# and revives from a real placed position, so fish top-ups stay in water (near the living school /
# clustered when the pond is small) instead of stranding on land. Target kept modest to match the
# scarce 500² water.
respawn_targets:
  rabbit: 60
  deer: 32
  goat: 20
  fish: 6
  wolf: 8
  bear: 4

# Per-species initial runtime vectors — buildAnimals REQUIRES a template per placed species so
# §6 speed/graze/combat formulas have real Stat + drive inputs at t=0. Herbivores start Graze,
# predators Hunt, fish drift (MoveTo); the controller re-decides each step (initial state only).
animal_templates:
  rabbit:
    stats: { Strength: 18, Agility: 85, Perception: 45 }
    drives: { hunger: 0.90, fatigue: 0.04, fear: 0.0, thermal: 0.0 }
    stamina: 1.0
    vital: 1.0
    current_action: Graze
  deer:
    stats: { Strength: 45, Agility: 70, Perception: 50 }
    drives: { hunger: 0.88, fatigue: 0.05, fear: 0.0, thermal: 0.0 }
    stamina: 1.0
    vital: 1.0
    current_action: Graze
  goat:
    stats: { Strength: 40, Agility: 65, Perception: 48 }
    drives: { hunger: 0.85, fatigue: 0.05, fear: 0.0, thermal: 0.0 }
    stamina: 1.0
    vital: 1.0
    current_action: Graze
  wolf:
    stats: { Strength: 78, Agility: 82, Perception: 65 }
    drives: { hunger: 0.96, fatigue: 0.02, thermal: 0.0 }
    stamina: 1.0
    vital: 1.0
    current_action: Hunt
  bear:
    stats: { Strength: 90, Agility: 55, Perception: 80 }
    drives: { hunger: 0.90, fatigue: 0.03, thermal: 0.0 }
    stamina: 1.0
    vital: 1.0
    current_action: Hunt
  fish:
    stats: { Strength: 10, Agility: 60, Perception: 40 }   # Perception added for the PD5b food-homing acuity
    drives: { hunger: 0.35, fatigue: 0.04, fear: 0.0, thermal: 0.0 }  # PD5b: fish now carries hunger
    stamina: 1.0
    vital: 1.0
    current_action: MoveTo
