  - { id: graze_30_84, species: grass, pos: [30.0, 84.0], length: 0.4, width: 0.25 }
  - { id: graze_48_12, species: grass, pos: [48.0, 12.0], length: 0.4, width: 0.25 }
  - { id: graze_48_30, species: grass, pos: [48.0, 30.0], length: 0.4, width: 0.25 }
