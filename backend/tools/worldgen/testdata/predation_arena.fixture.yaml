  - { id: graze_12_84, species: grass, pos: [12.0, 84.0], length: 0.4, width: 0.25 }
  - { id: graze_30_12, species: grass, pos: [30.0, 12.0], length: 0.4, width: 0.25 }
  - { id: graze_30_30, species: grass, pos: [30.0, 30.0], length: 0.4, width: 0.25 }
  - { id: graze_30_48, species: grass, pos: [30.0, 48.0], length: 0.4, width: 0.25 }
