# starter_village.fixture.yaml — the first hand-authored world fixture (W9 / world-integration WI-P4 input)
#
# A SMALL (128×128) starter world demonstrating the full env+fauna stack end-to-end (W12 RESOLVED: first
# fixture = small map + CLUSTERED village seeding so social proximity < sight, world-readiness §1). Loaded
# by backend/tools/worldgen.Load → builds navmap/climate/flora/decay states + the animal set + scent grid
# → world.InstallEnv/InstallFauna + Spawn/PlaceObject. This is a PER-RUN artifact, NOT content
# (architecture §7) — but schema-validated like content (content/schema/fixture.schema.json). Until the
# author-time generator (worldgen.Generate, WG1-a) exists, hand-authored fixtures drive runs.
#
# Determinism (D12): `seed` is BOTH the (unused-here) world-gen seed and the sim root seed source — same
# seed ⇒ same world. Agent RealStats are SAMPLED by world.Spawn from the stat GenSpec (NOT in the
# fixture); animal stats from the per-species GenSpec (W-seam). Positions are continuous (D11).
#
# LAYOUT (16×16 navmap cells @ 8 units = 128×128; row-major, row 0 = y∈[0,8)):
#   soil baseline · a RIVER running N→S at col 8 (sandy banks) → a SAND beach (row 13) → SEA coast (rows
#   14-15) · a MOUNTAIN block in the NE (rows 0-2, cols 12-14, an ore_node on it). The village CLUSTERS
#   on soil around (40,44) (west of the river); a DEER herd grazes the east pasture; a WOLF ranges the NE.
#
# What each scenario needs (docs/scenarios-world.md): FA1 graze (deer+grass+hunger), FA2 hunt (wolf+scent),
# FA3 wary/flee bands, FA8 per-species terrain cost (river/mountain), env weather (climate.yaml).

schema_version: 1
seed: 20260628

# ── Bounds (W1) — overrides content/world.yaml's 512² default for this small starter run ──
bounds:
  min: [0.0, 0.0]
  max: [128.0, 128.0]

# ── Terrain layout (navmap base layer + climate t=0) — 16 cols × 16 rows, row-major ──────
terrain:
  cols: 16
  rows: 16
  cells: [
    soil, soil, soil, soil, soil, soil, soil, soil, soil, soil, soil, soil, mountain, mountain, mountain, soil,   # row 0  (NE mountains)
    soil, soil, soil, soil, soil, soil, soil, soil, river, soil, soil, soil, mountain, mountain, mountain, soil,   # row 1  (river head, mountains, ore)
    soil, soil, soil, soil, soil, soil, soil, soil, river, soil, soil, soil, mountain, mountain, soil, soil,       # row 2
    soil, soil, soil, soil, soil, soil, soil, sand, river, sand, soil, soil, soil, soil, soil, soil,              # row 3  (river widens)
    soil, soil, soil, soil, soil, soil, soil, sand, river, sand, soil, soil, soil, soil, soil, soil,              # row 4
    soil, soil, soil, soil, soil, soil, soil, soil, river, soil, soil, soil, soil, soil, soil, soil,              # row 5  (village west, pasture east)
    soil, soil, soil, soil, soil, soil, soil, soil, river, soil, soil, soil, soil, soil, soil, soil,              # row 6
    soil, soil, soil, soil, soil, soil, soil, soil, river, soil, soil, soil, soil, soil, soil, soil,              # row 7
    soil, soil, soil, soil, soil, soil, soil, soil, river, soil, soil, soil, soil, soil, soil, soil,              # row 8
    soil, soil, soil, soil, soil, soil, soil, soil, river, soil, soil, soil, soil, soil, soil, soil,              # row 9
    soil, soil, soil, soil, soil, soil, soil, soil, river, soil, soil, soil, soil, soil, soil, soil,              # row 10
    soil, soil, soil, soil, soil, soil, soil, sand, river, sand, soil, soil, soil, soil, soil, soil,              # row 11 (river mouth widens)
    soil, soil, soil, soil, soil, soil, soil, sand, river, sand, soil, soil, soil, soil, soil, soil,              # row 12
    sand, sand, sand, sand, sand, sand, sand, sand, sand, sand, sand, sand, sand, sand, sand, sand,              # row 13 (beach / delta)
    sea, sea, sea, sea, sea, sea, sea, sea, sea, sea, sea, sea, sea, sea, sea, sea,                              # row 14 (sea coast)
    sea, sea, sea, sea, sea, sea, sea, sea, sea, sea, sea, sea, sea, sea, sea, sea                               # row 15
  ]

# ── Placed objects (ore_node / water_source / shelter / station) ─────────────────────────
objects:
  - { id: shelter_0, kind: shelter,      pos: [40.0, 44.0] }            # village shelter (cluster center)
  - { id: bench_0,   kind: tool_bench,   pos: [44.0, 46.0] }            # crafting station (station:bench)
  - { id: spring_0,  kind: water_source, pos: [66.0, 48.0] }            # on the river (col 8) — drinking water
  - { id: ore_0,     kind: ore_node,     pos: [104.0, 12.0], remaining: 8 }  # on the NE mountain (Mine target)

# ── Agents — CLUSTERED on soil around (40,44), all within ~16 units (W12 social-proximity) ─
# RealStats are sampled from the GenSpec at Spawn (not here). Tight cluster ⇒ neighbours fall inside
# sight radius (18) so the social/emergence layer can actually plan (live-emergence lever).
