# starter_village.fixture.yaml — the first hand-authored world fixture (W9 / world-integration WI-P4 input)
#
# A starter 192×192 world demonstrating the full env+fauna stack end-to-end (W12 RESOLVED: first
# fixture = small map + CLUSTERED village seeding so social proximity < sight, world-readiness §1). Loaded
# by backend/tools/worldgen.Load → builds navmap/climate/flora/decay states + the animal set + scent grid
# → world.InstallEnv/InstallFauna + Spawn/PlaceObject. This is a PER-RUN artifact, NOT content
# (architecture §7) — but schema-validated like content (content/schema/fixture.schema.json). Until the
# author-time generator (worldgen.Generate, WG1-a) exists, hand-authored fixtures drive runs.
#
# Determinism (D12): `seed` is BOTH the (unused-here) world-gen seed and the sim root seed source — same
# seed ⇒ same world. Agent RealStats are SAMPLED by world.Spawn from the stat GenSpec (NOT in the
# fixture); animal stats from the per-species GenSpec (W-seam). Positions are continuous (D11).
#
# LAYOUT (16×16 navmap cells @ 12 units = 192×192; row-major, row 0 = y∈[0,12)):
#   soil baseline · a RIVER running N→S at col 8 (sandy banks) → a SAND beach (row 13) → SEA coast (rows
#   14-15) · a MOUNTAIN block in the NE (rows 0-2, cols 12-14, an ore_node on it). The village CLUSTERS
#   on soil around (63,72) (west of the river); a DEER herd grazes the east pasture; a WOLF ranges the NE.
#   FORESTS EMERGE from oak clusters (D11 — no `forest` terrain type): a WEST WOODS (SW of the village), an
#   EAST WOODS (SE of the pasture, the deer's flee-refuge), a RIPARIAN gallery lining the river, plus
#   berry_shrub THICKETS by the rabbit fields — all `cover`-tagged so prey can break line-of-sight (M3).
#
# What each scenario needs (docs/scenarios-world.md): FA1 graze (deer+grass+hunger), FA2 hunt (wolf+scent),
# FA3 wary/flee bands, FA8 per-species terrain cost (river/mountain), env weather (climate.yaml).

schema_version: 1
seed: 20260628
cell_size: 12.0   # explicit terrain baked at cell 12 (192/12 ⇒ 12×11); pin so the world.yaml default (5) does not resize it

# ── Bounds (W1) — overrides content/world.yaml's 512² default for this small starter run ──
bounds:
  min: [0.0, 0.0]
  max: [192.0, 192.0]

# ── Terrain layout (navmap base layer + climate t=0) — FLAT-TOP HEX offset(col,row) grid, 12×11 ──
# i = row*cols + col (docs/hex-grid.md). CellSize=12 (circumradius) ⇒ navmap.OffsetDims = 12×11 over the
# 192² bounds. The river is a CONNECTED hex chain (col 6, rows 0→8) flowing N→sea delta; sand banks
# flank it (cols 5/7). NE mountains (cols 8-9, rows 0-2). Beach (row 8) → sea (rows 9-10). odd columns
# sit a half-row lower (odd-q); the river is straight down an even column so it reads as river-straight
# tiles. Placements below are hex-snapped: water_source ON the river column, riparian oaks on the banks.
terrain:
  cols: 12
  rows: 11
  cells: [
    soil, soil, soil, soil, soil, sand, river, sand, mountain, mountain, soil, soil,   # row 0  (NE mountains, river head)
    soil, soil, soil, soil, soil, sand, river, sand, mountain, mountain, soil, soil,   # row 1
    soil, soil, soil, soil, soil, sand, river, sand, soil, mountain, soil, soil,       # row 2
    soil, soil, soil, soil, soil, sand, river, sand, soil, soil, soil, soil,           # row 3
    soil, soil, soil, soil, soil, sand, river, sand, soil, soil, soil, soil,           # row 4  (village west, pasture east)
    soil, soil, soil, soil, soil, sand, river, sand, soil, soil, soil, soil,           # row 5
    soil, soil, soil, soil, soil, sand, river, sand, soil, soil, soil, soil,           # row 6
    soil, soil, soil, soil, soil, sand, river, sand, soil, soil, soil, soil,           # row 7
    sand, sand, sand, sand, sand, sand, river, sand, sand, sand, sand, sand,           # row 8  (beach / river delta)
    sea, sea, sea, sea, sea, sea, sea, sea, sea, sea, sea, sea,                         # row 9  (sea coast)
    sea, sea, sea, sea, sea, sea, sea, sea, sea, sea, sea, sea                          # row 10
  ]

# ── Placed objects (ore_node / water_source / shelter / station) ─────────────────────────
objects:
  - { id: shelter_0, kind: shelter,      pos: [60.0, 66.0] }            # village shelter (cluster center)
  - { id: bench_0,   kind: tool_bench,   pos: [66.0, 69.0] }            # crafting station (station:bench)
  - { id: spring_0,  kind: water_source, pos: [108.0, 72.0] }           # on the river (hex col 6) — drinking water
  - { id: ore_0,     kind: ore_node,     pos: [156.0, 18.0], remaining: 8 }  # on the NE mountain (Mine target)

# ── Agents — CLUSTERED on soil around (40,44), all within ~16 units (W12 social-proximity) ─
# RealStats are sampled from the GenSpec at Spawn (not here). Tight cluster ⇒ neighbours fall inside
# sight radius (18) so the social/emergence layer can actually plan (live-emergence lever).
agents:
  - { id: villager_1, pos: [54.0, 60.0] }
  - { id: villager_2, pos: [66.0, 60.0] }
  - { id: villager_3, pos: [60.0, 72.0] }
  - { id: villager_4, pos: [72.0, 69.0] }
  - { id: villager_5, pos: [51.0, 75.0] }
  - { id: villager_6, pos: [69.0, 78.0] }
  - { id: villager_7, pos: [78.0, 63.0] }
  - { id: villager_8, pos: [57.0, 81.0] }

# ── Flora (suitability-seeded plants) — DORMANT unless flora is active ────────────────────
# Grass = the deer/goat pasture (east + mountain-base); berry_shrub THICKETS = mature food bushes that
# double as small-prey cover (cover tag); oak WOODS = cover-tagged forest patches (dense canopy). Lengths
# set to a mature stage so they bear/emit scent:food + cast full shade immediately (else start as seedlings).
# All flora sits on soil/bank (never in the river hex col 6, on the NE mountain, or on the beach/sea rows 9-10).
flora:
  # GRASS pastures — grazing ground-cover (scent:food)
  - { id: grass_1, species: grass, pos: [129.0, 87.0], length: 0.3, width: 0.2 }   # east pasture (deer graze)
  - { id: grass_2, species: grass, pos: [141.0, 96.0], length: 0.3, width: 0.2 }
  - { id: grass_3, species: grass, pos: [123.0, 102.0], length: 0.3, width: 0.2 }
  - { id: grass_4, species: grass, pos: [147.0, 84.0], length: 0.3, width: 0.2 }
  - { id: grass_6, species: grass, pos: [75.0, 69.0], length: 0.3, width: 0.2 }   # near village
  - { id: grass_8, species: grass, pos: [150.0, 42.0], length: 0.3, width: 0.2 }  # mountain-base pasture (goat grazes, then climbs)
  # THICKETS (berry_shrub) — food + small-prey cover, clustered around the rabbit fields + pasture edge
  - { id: shrub_1, species: berry_shrub, pos: [87.0, 60.0], length: 1.0, width: 0.8 }  # mature (stage 2) → berries + cover
  - { id: shrub_2, species: berry_shrub, pos: [78.0, 90.0], length: 1.0, width: 0.8 }
  - { id: shrub_3, species: berry_shrub, pos: [84.0, 72.0], length: 1.0, width: 0.8 }  # in the rabbit field (hide spot)
  - { id: shrub_4, species: berry_shrub, pos: [90.0, 84.0], length: 1.0, width: 0.8 }
  - { id: shrub_5, species: berry_shrub, pos: [72.0, 84.0], length: 1.0, width: 0.8 }
  - { id: shrub_6, species: berry_shrub, pos: [132.0, 114.0], length: 1.0, width: 0.8 } # pasture edge (deer nearer cover)
  - { id: shrub_7, species: berry_shrub, pos: [144.0, 111.0], length: 1.0, width: 0.8 }
  # WEST WOODS (oak) — forest SW of the village (west of the river); flee-cover for the village prey
  - { id: oak_1, species: oak, pos: [42.0, 114.0], length: 8.0, width: 5.0 }   # mature (> stage 6) → full canopy shade
  - { id: oak_2, species: oak, pos: [54.0, 120.0], length: 8.0, width: 5.0 }
  - { id: oak_3, species: oak, pos: [48.0, 132.0], length: 8.0, width: 5.0 }
  - { id: oak_4, species: oak, pos: [60.0, 126.0], length: 8.0, width: 5.0 }
  - { id: oak_5, species: oak, pos: [66.0, 138.0], length: 8.0, width: 5.0 }
  - { id: oak_6, species: oak, pos: [42.0, 144.0], length: 8.0, width: 5.0 }
  # EAST WOODS (oak) — forest SE of the deer pasture; the herd's flee-refuge (and the bear's cover)
  - { id: oak_7,  species: oak, pos: [156.0, 102.0], length: 8.0, width: 5.0 }
  - { id: oak_8,  species: oak, pos: [168.0, 108.0], length: 8.0, width: 5.0 }
  - { id: oak_9,  species: oak, pos: [162.0, 120.0], length: 8.0, width: 5.0 }
  - { id: oak_10, species: oak, pos: [174.0, 114.0], length: 8.0, width: 5.0 }
  - { id: oak_11, species: oak, pos: [168.0, 132.0], length: 8.0, width: 5.0 }
  - { id: oak_12, species: oak, pos: [156.0, 126.0], length: 8.0, width: 5.0 }
  # RIPARIAN gallery (oak) — wooded river banks (a cover corridor by the water crossing)
  - { id: oak_13, species: oak, pos: [90.0, 108.0], length: 8.0, width: 5.0 }   # west bank (col 7)
  - { id: oak_14, species: oak, pos: [90.0, 120.0], length: 8.0, width: 5.0 }
  - { id: oak_15, species: oak, pos: [126.0, 108.0], length: 8.0, width: 5.0 }  # east bank (hex col 7)
  - { id: oak_16, species: oak, pos: [126.0, 120.0], length: 8.0, width: 5.0 }

