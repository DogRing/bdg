  - { id: grass_8, species: grass, pos: [100.0, 28.0], length: 0.3, width: 0.2 }  # mountain-base pasture (goat grazes, then climbs)
  - { id: shrub_1, species: berry_shrub, pos: [58.0, 40.0], length: 1.0, width: 0.8 }  # mature (stage 2) → berries
  - { id: shrub_2, species: berry_shrub, pos: [52.0, 60.0], length: 1.0, width: 0.8 }

