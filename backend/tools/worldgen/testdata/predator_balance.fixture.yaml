  # Grazing ground: a deterministic 20-unit grid, hand-placed rather than procedural.
  # Density placement was tried first and silently produced ZERO grass: it derives establishment
  # from the generated moisture field, which only exists for `terrain: random: true`. This fixture
  # authors its terrain explicitly (the river and mountain are the point), so moisture reads 0
  # everywhere and grass carrying_capacity — `5 * moisture * …` — evaluates to 0. The first two
  # runs of this bed were therefore famines: 155 then 177 rabbit STARVATION deaths against ~20
  # kills, which would have made every predation number meaningless (a hunt-success target is
  # about healthy prey, not dying ones). The grid skips the river column.
