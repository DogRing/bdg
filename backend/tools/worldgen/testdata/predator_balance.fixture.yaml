# predator_balance.fixture.yaml — the tuning bed for predator-prey balance (docs/plans/fauna.md 클러스터 10
# "균형(공통)": tune to a measurable ~15% hunt success with balance.yaml + tools/tuner).
#
# WHY A THIRD FIXTURE. The other two cannot measure this:
#   • predation_arena  — a 96×96 FORCED-encounter bed: a wolf starts on top of the rabbits. Good for
#     "does a chase resolve at all", useless for "can a predator population feed itself", because
#     nothing about finding prey is being tested.
#   • rabbit_meadow    — the live demo world: 500² with 2 wolves + 1 bear and grass-dominated ground.
#     Measured 2026-07-19: prey hide in cover on 0.17% of ticks, so M3/M4b/M5b essentially never fire,
#     and every predator hunts alone across 250,000 unit². It was built to be watched, not measured.
#
# THIS FIXTURE is an OPEN world (predators must find their own prey — no forced start) sized and stocked
# so the shipped mechanisms actually get exercised and statistics accumulate in a few thousand ticks:
#   • 240×240 (57,600 unit²) — ~4× denser than the meadow, so encounters happen without teleporting
#     anyone next to anyone; chases still have room to run and to be escaped.
#   • A RIVER down the middle hex column (x≈126) — exercises M4-a: wolf river cost 3.0 vs deer 1.5, so a
#     fleeing deer can cross to a refuge the wolf will not follow into.
#   • A MOUNTAIN block in the NE — exercises per-species terrain cost the other way (goat country).
#   • COVER IN CLUSTERS, not scattered singles: berry_shrub thickets west (rabbit-scale cover) and oak
#     groves east (deer-scale). Clustering matters — M3 hiding, M4-b cover drag and M5-b ambush
#     concealment all read local cover DENSITY, so a lone plant expresses almost nothing.
#   • 4 wolves + 2 bears against 12 rabbits / 8 deer / 4 goats — enough predators that hunt attempts
#     accumulate, enough prey that a few kills do not end the experiment.
#
# NO respawn_targets ON PURPOSE. Respawn is a floor that re-introduces the extinct, which is exactly the
# signal we are trying to read here: whether predators can feed themselves. Extinction is a RESULT in
# this fixture, not a failure of it — the harness reports time-to-extinction as a tuning number.
#
# Predators start moderately hungry (0.5), not starving: we want them motivated to hunt while still
# leaving room to observe whether hunting actually keeps them fed. Prey start lightly hungry (0.3) so
# they graze and roam rather than standing still (FM14b), which is what makes encounters organic.

schema_version: 1
seed: 20260719
cell_size: 12.0   # explicit terrain baked at cell 12: cols=ceil(240/(1.5·12))+1=15, rows=ceil(240/(√3·12))+1=13

bounds:
  min: [0.0, 0.0]
  max: [240.0, 240.0]

# Flat-top hex offset grid, 15×13. River = hex column 7 (centre x≈126) splitting WEST from EAST.
# Mountain = the NE corner (cols 12–14, rows 0–2), goat country the wolves pay to enter.
terrain:
  cols: 15
  rows: 13
  cells: [
    soil, soil, soil, soil, soil, soil, soil, river, soil, soil, soil, soil, mountain, mountain, mountain,  # row 0
    soil, soil, soil, soil, soil, soil, soil, river, soil, soil, soil, soil, mountain, mountain, mountain,  # row 1
    soil, soil, soil, soil, soil, soil, soil, river, soil, soil, soil, soil, mountain, mountain, mountain,  # row 2
