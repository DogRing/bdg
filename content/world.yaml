# content/world.yaml — World setup parameters (geometry · grids · motion · sizes · senses · render)
#
# The SINGLE tunable surface for world SHAPE/SIZE/SPEED values, externalized so they can be
# adjusted without touching code or hunting through balance.yaml (docs/plans/world-integration.md W1-W9).
#
# ⚠ INITIAL, UNTUNED placeholders (recommended defaults, 2026-06-27). Adjustable later; balance
#   auto-tuning (design.md §4) may sweep them. Values are CONSTRAINED to each other — keep the
#   inline invariants true when editing (esp. scent_cell_size ≥ motion.max_speed × cadence.scent_spread).
#
# Relationship to balance.yaml: balance.yaml `world:` holds engine RUNTIME knobs already wired into
#   world.Config (spatial_hash_cell, outcome_difficulty_base, backup_every_ticks, …). THIS file holds
#   world GEOMETRY + entity sizes + base motion + grids + render hints (new, fed by platform/config).
#   `grids.navmap_cell_size` MIRRORS `balance.yaml world.spatial_hash_cell` (keep in sync).
#
# Units: world units (free continuous coords, D11). Time = ticks (1 tick = 1 game-minute);
#   1 day = 1440 ticks, 1 year = 120 days = 172,800 ticks (worldtime calendar).
# Schema: content/schema/world.schema.json (WI-P0 — platform/config validates + injects).

schema_version: 1

# ── Bounds (W1) — the finite rectangle the env grids span ────────────────────────────
# A world-gen / scenario FIXTURE is authoritative and OVERRIDES this; this is the headless default.
# Agents & animals keep CONTINUOUS Pos (D11) and MAY stray outside — bounds clamp ONLY grid lookups
# (climate CellAt / navmap cell index), never an agent's position.
bounds:
  min: [0.0, 0.0]
  max: [192.0, 192.0]            # headless default; the starter fixture (192×192) overrides. 192/5 ≈ 27×24 navmap cells

# ── Grids (W2) — auxiliary index cell sizes over the same continuous space ────────────
grids:
  navmap_cell_size: 5.0          # terrain/path/render hex resolution — DECOUPLED from perception (docs/plans/shelter.md Q-M1,
                                 #   2026-07-08): independent of balance.yaml world.spatial_hash_cell (=12, perception radius).
                                 #   500×500 live world ⇒ 68×59 hexes. Lower = finer terrain (cost: path nodes + terrain payload).
  climate_grid_cols: 16          # coarse climate grid; 512/16 = 32-unit climate cells
  climate_grid_rows: 16          #   ⇒ one climate cell = 4×4 navmap cells (32/8); world owns GridCell→[]navmap.Cell
  scent_cell_size: 10.0          # W3 floor: MUST be ≥ motion.max_speed × cadence.scent_spread (= 1.4×6 = 8.4 ✓);
                                 #   also ≈ herbivore smell radius (Read scans own cell + neighbors within radius)

# ── Spoor: 지면 잔향 (PD9, 사람 승인 2026-07-19) ──────────────────────────────────────
# 동적 층은 매 틱 재구축되므로, 이 층이 생기기 전 세계에는 **동물이 어딘가에 있었다는 기록이 아예 없었다** —
# 포식자는 살아있고 한두 셀 안에 있는 개체만 감지할 수 있었고, 그래서 라이브 월드에서 사냥이 0이었다(PD8).
# 잔향은 공기 중 플룸이 아니라 **땅에 묻은 냄새**라 확산시키지 않는다(반복 확산=열방정식 → 자취가 뭉개져 따라갈
# 기울기가 사라진다). 방향도 따로 푼다: 플룸은 바람을 거슬러 올라가지만 자취는 **기울기를 따라간다**.
scent_trail:
  decay: 0.994                   # 틱당 감쇠. 1일=1440틱(1틱≈1분)이므로 반감기 ln2/0.006 ≈ 116틱 ≈ 2게임시간.
  cap: 0.6                       # 셀당 상한. **생체 냄새 크기(Vital≈1.0)보다 낮게 유지할 것** — 안 그러면 오래 머문
                                 #   잠자리가 눈앞의 살아있는 개체를 이겨서 포식자가 사슴을 두고 길을 킁킁대게 된다.
  strength:                      # 침전량 중 땅에 묻는 비율. 채널별 opt-in — 어떤 냄새가 남는지는 콘텐츠가 정한다(D4/D10).
    prey: 0.010                  #   실측 튜닝(라이브 초원 5시드, 6000틱, 사냥 횟수 평균): OFF 7.4 → 0.006에서 10.4 →
                                 #   **0.010에서 13.6** → 0.016에서 15.0(고원). 잔향이 포식을 거의 두 배로 만든다.
                                 #   진짜 위력은 세기가 아니라 **면적**이다: Read가 후각 반경 내 셀을 합산하므로
                                 #   무리가 훑고 간 넓은 자취는 셀 여러 개가 더해져 멀리서도 게이트를 넘는다.
                                 #   ⚠ 더 세게 갈수록 좋지는 않다 — 포화값 strength/(1-decay)가 cap을 크게 넘으면
                                 #   방문한 셀이 전부 상한에 붙어 **장이 평평해지고 따라갈 기울기가 사라진다**
                                 #   (0.030에서 사냥 21→5로 붕괴). 고원의 아래쪽 끝을 택함.
                                 # predator는 **일부러 뺐다**: 공포는 `scent.predator>0 → wary`로 SET되므로 포식자
                                 #   잔향을 켜면 늑대가 한 번 지나간 곳마다 피식자가 영구 경계 상태가 된다(공포 포화).
                                 #   '공포의 지형' 자체는 할 만한 설계지만 별도 튜닝이 필요하지 곁다리로 켤 것이 아니다.

# ── Motion (W3) — base locomotion (world units per fauna DT; DT = 1 tick) ──────────────
# Agents move via MoveTo (travel time ∝ distance, balance world.arrival_epsilon) — NOT governed here.
# These are fauna base speeds; the §6 Speed program modulates them by fear/fatigue + terrain Cost.
motion:
  fauna_dt: 1.0
  herbivore_base_speed: 1.0
  predator_base_speed: 1.4
  max_speed: 1.4                 # fastest species; drives scent_cell_size floor (1.4 × 6 = 8.4 ≤ 10 ✓)
  move_deadband: 0.0             # FM9 (docs/plans/fauna.md §4.3): §6 speed below this ⇒ hold position (energy conservation). 0 = OFF (byte-identical); raise in P_fa4 tuning just above idle speed so unstimulated fauna mostly rest

# ── Water (FM4) — fauna thirst → water-attraction field (docs/plans/fauna.md §4.1 FM4-src) ─────────────
# Config derives the drinkable-terrain SOURCE set from terrain.yaml attrs (fresh + open water); world
# floods a static attraction field from those cells. A thirsty species (§6 `thirst` drive + a `seek:water`
# action) steers up the gradient. No species authors `seek:water` yet ⇒ field is built but unqueried
# (byte-identical); enable per-species in content tuning.
water:
  salinity_max: 0.05             # terrain salinity ≤ this = fresh (drinkable); excludes sea (salinity 1.0)
  moisture_min: 0.9              # AND moisture ≥ this = open water (river/lake moisture 1.0; not damp soil 0.5). ≤ 0 ⇒ water field OFF
  field_decay: 0.03              # attraction intensity decay per world-unit (reach = weight/decay); mirrors hazard decay (untuned)

# ── Cadence (W4) — env-phase step intervals (ticks; world drives via tick % N) ─────────
cadence:
  climate_step: 60               # 1 game-hour (climate RESOLVED #9; wind shares this)
  flora_step: 60                 # flora 1g rec (a) — aligned with climate
  decay_step: 60                 # decay bulk pass
  scent_spread: 6                # Ns — scent diffusion bulk pass (drives scent_cell_size floor)
  fauna_dormant_period: 100      # F45 dormant re-arbitration period N (ID-phase spread)
  fauna_wake_cooldown: 30        # ticks an animal stays ACTIVE after a predator-scent wake
  sleep_wake_scent_threshold: 0.25 # P_sleep1/SS3: a SLEEPING animal wakes only to predator scent >= this (deep sleeper ignores faint/distant threat; untuned)
  # fauna.Step is called EVERY tick; active/dormant is internal to fauna (F45).
  exchange_min_ticks: 10         # combat exchange cooldown lower bound (FC3)
  exchange_max_ticks: 20         # combat exchange cooldown upper bound (FC3)
  engage_cooldown_min_ticks: 50  # failed/initial engage cooldown lower bound (FC3)
  engage_cooldown_max_ticks: 100 # failed/initial engage cooldown upper bound (FC3)
  disengage_range_factor: 2.0    # disengage when target beyond this × scent_cell_size (FC6)
  stamina_drop_threshold: 0.05   # predator disengages when stamina falls below this (FC6)
  stamina_drain_per_tick: 0.038  # stamina spent per tick while engaged → predator tires + stops (#8)
  stamina_recover_per_tick: 0.01 # stamina regained per tick while free → recovers, re-engages (burst hunting)
  fatigue_pursuit_per_tick: 0.012 # fatigue gained per tick during a high-effort chase/flight (M2 endurance → speed §6 slows the tired one)
  fatigue_recover_per_tick: 0.008 # fatigue shed per tick while resting / low-effort
  sleep_fatigue_recover_per_tick: 0.020 # P_sleep1/SS2: deeper fatigue recovery while SLEEPING (state:sleep) — ~2.5× rest (untuned)
  vital_regen_per_tick: 0.001    # slow vital recovery, clamped by VitalCap (FC7)
  vital_cap_damage_fraction: 0.05 # exchange damage fraction applied as scar cap damage (FC7)
  hide_duration: 35               # M3 cover-hiding duration after a successful flee-near-cover roll
  hidden_flush_factor: 1.0        # hidden prey is flushed if predator is within this × scent_cell_size
  hide_cover_factor: 1.0          # cover reach = this × scent_cell_size
  cover_radius_factor: 3.0        # M4-b: × plant Width → cover-drag radius
  conceal_factor: 1.0             # M5-b: × cover density => predator concealment (untuned placeholder)
  graze_depletion_per_hunger: 5.0 # PD2/P_fa4b: flora Length cropped per 1.0 hunger recovered by grazing → 과방목→국소 기근→초식 아사·이동압(공유지 비극). scent mag=Length+Width라 고갈=희미한 냄새(P_fa4a와 결합). 0 ⇒ 무소모.
                                  # 2.0→5.0 재적합 (2026-07-19, 7ce6edf 직후): 이전 값은 **고장난 급식 루프** 위에서 맞춰졌다 — 채집 시도의 95~99%가 0을 회수하던 시절이라 실효 먹이 공급이 실제보다 훨씬 컸다. 루프를 고치자
                                  # 피식자가 배부르고(허기 0.355·58% 포만) 정주화(FM14b: 배부르면 move_deadband 아래로 떨어져 정지)되어 **포식자와 마주치지 않게** 됐다: 포식자가 오히려 굶었다(허기 0.657, 아사 21 vs 포식 1).
                                  # k는 **한 끼의 영양가가 아니라 한 패치가 몇 끼를 버티는가**를 정한다(recovery=removed/k=want, 생물량이 남아 있는 한 불변) ⇒ 국소 고갈을 앞당겨 이동압을 만든다. 5시드 실측(포식 베드 6000틱, 평균):
                                  # 포식 4.2→10.4 · 포식자 아사 17.8→12.0 · 포식자 잔존 5.6→6.4 · 피식자 아사 57→187 · 피식자 개체수는 유지(min 33→28, final 43→38). 즉 피식자 사망 원인이 기아 일변도에서 포식으로 일부 이동.
                                  # 기각한 대안: **포식자 후각 확대**(wolf 20→32/bear 22→34) — 2×2 요인실험에서 사냥은 소폭 늘지만 포식자 아사가 되레 악화(12.0→14.2) ⇒ 결합을 못 끊는다. 희소성이 지배 레버.
  respawn_cadence: 200            # every N ticks, top each species up toward its respawn_target (F9)

# ── Sizes (W6 + flora/resource) — representative defaults ──────────────────────────────
# Per-species values ultimately live in content/objects.yaml (flora:/fauna: blocks); these are the
# starting defaults + the render baseline. Animals are POINTS (W6): 'size' is a §6 ATTRIBUTE
# (apparent_temp / speed inputs), NOT a collision radius. Flora has real morphology (Length/Width).
sizes:
  flora:                         # Length (height) / Width (canopy spread), world units
    grass:    { length: 0.5,  width: 0.3 }
    bush:     { length: 2.0,  width: 1.5 }
    tree:     { length: 12.0, width: 6.0 }
    seedling_start: { length: 0.2, width: 0.1 }   # propagation children start here
  fauna:                         # 'size' = §6 attribute (NOT collision); interaction = action range
    herbivore: 1.2
    predator:  1.0
  resource:                      # visual / interaction footprint radius, world units
    ore_node:   1.5
    clay_patch: 1.0
    stone:      1.0

# ── Senses (fauna) — default sense radii (per-species → objects.yaml fauna.senses later) ─
# fov_arc = the HALF-angle (radians) of the forward sight cone (Heading ± fov_arc), F44.
# Prey: WIDE FOV (vigilance). Predator: NARROW, longer-range FOV (focused pursuit).
senses:
  herbivore: { smell_radius: 10.0, sight_radius: 14.0, fov_arc: 1.05 }   # ~60° half ⇒ 120° FOV
  predator:  { smell_radius: 12.0, sight_radius: 20.0, fov_arc: 0.79 }   # ~45° half ⇒  90° FOV

# ── Render (frontend) — display hints for the SSE WorldFrame consumer ──────────────────
render:
  pixels_per_unit: 2.0           # canvas scale: 512 units → 1024 px
  # Frontend reads: bounds (canvas extent), sizes.* (sprite scale), positions + deltas (WorldFrame),
  # climate (temperature / apparent_temp / raining / wind / day_night) for ambient FX.
  # God-view fields (real_stats) are NEVER sent over SSE (data-contracts §4).
