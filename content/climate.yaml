# content/climate.yaml — climate DATA: dynamic-terrain transitions + climate tuning (CA1-3)
#
# The single owner of climate DATA (docs/plans/climate.md RESOLVED #4 + §1c CA1-3). Two blocks:
#   transitions — the from-type × condition-§6 → to-type dynamic-terrain rules (D4/D10), compiled into
#                 engine/env/climate.Rules. ORDER is significant: for a given `from`, the FIRST rule
#                 whose `when` §6 boolean is true wins (deterministic, D12). An EMPTY array = climate-off
#                 (outcome-neutral introduction phase). Every from/to MUST be a terrain id in
#                 content/terrain.yaml (platform/config cross-checks), except the reserved thaw target
#                 __origin__, which engine/env/climate.Step resolves before storing or emitting.
#   balance     — rates + the annual-°C cycle + the world-uniform wind random-walk (D9 spirit: rates are
#                 content; the rain SHAPE — 10d-expected / 30d-forced / 2-12h-duration — is fixed design
#                 in engine code, only its rates appear here so engine stays literal-free, D10).
#
# ⚠ TEMPERATURE IS ACTUAL °C (CA1-3), NOT normalized [0,1]. `when` thresholds are °C (e.g.
#   "temperature < 0"). A daily °C delta + an annual sinusoid + a rain drop ride on the annual midline.
# ⚠ COARSE-GRID GEOMETRY (climate_grid_cols/rows) + world bounds live in content/world.yaml and are
#   injected into climate.Config by platform/config — NOT here.
# ⚠ ACTIVATION HOMEWORK (world-readiness): the legacy flora.suitability / decay.accel §6 formulas still
#   treat `temperature` as [0,1] (e.g. berry_shrub "(1 - temperature)", berries accel "+ temperature*1.0").
#   Those MUST be re-baselined to °C when climate is activated (a deliberate re-baseline, like the
#   fauna/flora/decay introductions). The fauna apparent_temp formulas (objects.yaml) are already °C.
#
# Schema: content/schema/climate.schema.json (platform/config validates + compiles via engine/kernel/expr).

schema_version: 1

# ── Initial per-cell seeds (CA3) — grid GEOMETRY is content/world.yaml's, not here ──────
init:
  initial_moisture: 0.5            # [0,1] starting Moisture for every cell
  initial_temperature: 12.5        # °C starting Temperature (≈ annual_mid; sub-zero allowed, no clamp)

# ── Dynamic-terrain transitions (CA, D4/D10) ────────────────────────────────────────────
# First-match-wins per `from` (D12). Water freezes below 0°C and thaws above 2°C; the hysteresis
# gap prevents threshold flicker. The moisture rules cover drought and wet recovery.
transitions:
  - { from: lake, to: ice, when: "temperature < 0" }
  - { from: river, to: ice, when: "temperature < 0" }
  - { from: ice, to: __origin__, when: "temperature > 2" }
  - { from: soil, to: dry_dirt, when: "moisture < 0.15" } # 비옥한 흙이 가뭄으로 마르면 마른 흙(dry_dirt)이 됨
  - { from: dry_dirt, to: soil, when: "moisture > 0.40" } # 마른 흙에 수분이 차면 다시 비옥한 흙이 됨
  - { from: lake, to: dry_dirt, when: "moisture < 0.20" } # 호수가 증발하면 마른 흙이 됨
  - { from: river, to: sand, when: "moisture < 0.20" }    # 강이 마르면 모래가 됨
  - { from: sea, to: sand, when: "moisture < 0.10" }      # 바다가 마르면 모래가 됨

# ── Tuning injected into climate.Config (D9 spirit; the rain SHAPE is fixed design) ──────
balance:
  # Ice terrain id (ICE, plan §1e). Empty/absent disables ice origin capture.
  ice_type: ice

  # Rain process (1a) — the 10d-expected / 30d-forced / 2-12h-duration SHAPE is fixed; rates tunable.
  rain_prob_per_hour:  0.0042      # per-game-hour PRain increment, calibrated so E[first rain] ≈ 240h (10 days). UNTUNED
  rain_hard_cap_hours: 720         # forced rain after 720 dry game-hours (30 days) — FIXED DESIGN
  rain_dur_min_hours:  2           # rain lasts 2..12 game-hours — FIXED DESIGN
  rain_dur_max_hours:  12
  moisture_rain_rate:  0.08        # Moisture gained per game-hour while raining
  evap_base_rate:      0.005       # base Moisture lost per dry game-hour (temperature-independent) (기존 0.01에서 하향)
  evap_temp_scale:     0.0005      # EXTRA Moisture lost per dry game-hour per +°C (Temp→Moisture feedback, floored at 0) (기존 0.0015에서 하향)

  # Annual °C cycle (CA1) — actual temperature = annual_mid + annual_amp·sin(2π·YearFraction + annual_phase)
  #                          + daily delta − rain drop. Year = 120 days = 172,800 ticks (world.yaml calendar).
  annual_mid:   12.5               # °C year-cycle midline (the center of the swing)
  annual_amp:   17.5               # °C annual amplitude ⇒ ≈ −5 … 30 °C over the year
  annual_phase: 0.0               # φ radians — peak/trough alignment to YearFraction

  # Daily °C deltas (CA3) — added around the annual midline within a day (1 day = 1440 ticks).
  temp_day_peak:  6.0              # +°C at midday peak
  temp_night_low: -6.0             # −°C at the night trough (≤ 0)
  temp_rain_drop: 3.0              # °C reduction while raining

  # World-uniform wind random-walk (CA2) — Dir mean-reverts to prevailing; Mag noise around the mean.
  wind_prevailing_dir: 1.5708      # ≈ π/2: prevailing wind blows toward +Y (radians [0,2π))
  wind_dir_drift:      0.15        # per-step seeded random-walk step scale for Dir (radians)
  wind_dir_reversion:  0.05        # fraction Dir is pulled back toward prevailing each step [0,1]
  wind_mag_mean:       0.30        # mean wind magnitude [0,1]
  wind_mag_noise:      0.10        # seeded per-step magnitude noise (resulting Mag clamped [0,1])

  # World-uniform snowpack (CS3, plan §1d) — freezing precipitation builds SnowCover∈[0,1]; above
  # freezing it melts ∝ °C over the freeze point (warmer ⇒ faster). 0…freeze precip shows as snow
  # (frontend) yet never accumulates → "눈이지만 녹고". Drives the flora snow-sprite switch (CS4). UNTUNED.
  snow_freeze_c:   0.0             # °C at/below which precipitation accumulates as snow
  snow_accum_rate: 0.06            # SnowCover gained per game-hour of freezing precipitation
  snow_melt_rate:  0.006           # SnowCover lost per game-hour per +°C above snow_freeze_c
