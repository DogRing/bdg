# content/terrain.yaml — terrain TYPE catalog (base materials + §5 attributes)
#
# The terrain TYPE vocabulary (docs/design.md §5): 바탕재료 sand/soil/river/mountain/sea + the §5
# attribute preset vector. Each entry = a navmap.TerrainType (base_cost / passable / required_tags)
# PLUS the attrs that feed the `terrain.<attr>` §6 operands (flora suitability, traversal gates,
# climate transitions). This is a TYPE table, NOT a layout — which cell is which type is the
# world-gen / scenario FIXTURE (docs/world-gen.md). Every terrain id referenced elsewhere
# (climate transitions, objects.yaml source.depleted_terrain, resource affinity) MUST appear here.
#
# ⚠ UNTUNED placeholders (adjustable later; balance auto-tuning may sweep base_cost). Attribute
#   conventions: grain_size/moisture/depth/slope/salinity ≈ [0,1]; temperature = a STATIC °C offset
#   (the DYNAMIC temperature is climate's, CA3). Schema: content/schema/terrain.schema.json.
#
# fauna R2 note: high-base_cost water (river) is TRAVERSABLE-at-cost — the world's footprint-only
#   TerrainSampler lets animals swim it slowly; only `passable:false` (sea/cliff) truly blocks.

schema_version: 1

terrains:
  - id: soil                       # default fertile ground — the flora/agent baseline
    base_cost: 1.0
    passable: true
    attrs: { grain_size: 0.5, moisture: 0.5, depth: 0.0, slope: 0.1, salinity: 0.0 }
    extract:                       # terrain-driven Mine (R1): clay on soil + stone anywhere
      yields:
        - { item: clay,  chance: "Dexterity / 100", qty: [1, 3] }
        - { item: stone, chance: "Dexterity / 100", qty: [1, 2] }

  - id: sand                       # loose, dry, low fertility (beaches, arid)
    base_cost: 1.3
    passable: true
    attrs: { grain_size: 0.2, moisture: 0.2, depth: 0.0, slope: 0.1, salinity: 0.1 }
    extract:
      yields:
        - { item: stone, chance: "Dexterity / 100", qty: [1, 2] }

  - id: river                      # fresh flowing water — fordable/swimmable at high cost (R2)
    base_cost: 3.0
    passable: true
    required_tags: []              # swimmable for fauna (TerrainSampler); a Swim-gated ford for agents is a frontier
    attrs: { grain_size: 0.4, moisture: 1.0, depth: 0.5, slope: 0.0, salinity: 0.0 }

  - id: lake                       # still fresh water — outflow-less basin (world-gen WG2-a hydrology).
    base_cost: 3.0                 #   Swimmable at river-like cost so an inland lake never TRAPS land
    passable: true                 #   fauna (R2); only sea truly blocks.
    required_tags: []
    attrs: { grain_size: 0.4, moisture: 1.0, depth: 0.7, slope: 0.0, salinity: 0.0 }

  - id: mountain                   # steep rock — high traversal cost, mineral-bearing (resources R7)
    base_cost: 2.5
    passable: true
    attrs: { grain_size: 0.8, moisture: 0.2, depth: 0.0, slope: 0.9, salinity: 0.0 }
    extract:                       # stone abundant on mountain; scarce metals = finite ore_node (objects.yaml)
      yields:
        - { item: stone, chance: "Dexterity / 100", qty: [1, 3] }

  - id: sea                        # deep salt water — impassable without a boat (frontier)
    base_cost: 1.0                 # base_cost moot while passable:false
    passable: false
    attrs: { grain_size: 0.3, moisture: 1.0, depth: 1.0, slope: 0.0, salinity: 1.0 }

  - id: bare_rock                  # depleted-node reroute (objects.yaml ore source.depleted_terrain, Xm3)
    base_cost: 2.0
    passable: true
    attrs: { grain_size: 1.0, moisture: 0.1, depth: 0.0, slope: 0.5, salinity: 0.0 }
    extract:                       # exhausted ore site still yields surface stone
      yields:
        - { item: stone, chance: "Dexterity / 100", qty: [1, 2] }
