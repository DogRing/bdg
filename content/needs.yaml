# content/needs.yaml — need / value dimensions (data-driven, D9 / D10)
#
# platform/config loads this into the engine/needs registry. A Value is
# {Dimension, Ref, Posture, Setpoint} (docs/glossary.md); the Dimensions it may
# target are defined here. Adding a dimension is a data change, no code.
#
# D9 — objects carry ONLY their satisfaction Effect (supply); see content/objects.yaml.
#      There is NO "future need" field anywhere. Demand is derived by the planner as
#      `rate x predicted-time` and forward-simulated; provisioning subgoals emerge.
#      Authors set ONLY the per-need `rate` here — never quantities or schedules.
#
# Schema: content/schema/needs.schema.json

schema_version: 1

# kind:
#   consumable  — the satisfaction level decays by time at `rate` (per game-minute);
#                 the planner forward-rolls it and inserts provisioning when a setpoint
#                 breach is predicted. Replenished by an action Effect / object supply.
#   conditional — not time-driven; set by world/social state (threats, standing, terrain).
#                 `rate` is 0; salience comes from the current gap to setpoint.
#
# default.* are the agent-generation defaults for a fresh Value on this Dimension;
# individual agents perturb setpoint by disposition (engine/values).
needs:
  - id: Satiety
    kind: consumable
    rate: 0.00070            # satiety lost per game-minute (~ full -> empty in a long day)
    default:
      posture: MaintainAbove
      setpoint: 0.55
      referent: Self
    salience:
      curve: deficit         # salience ~ max(0, setpoint - level)
      gain: 1.0

  - id: Hydration
    kind: consumable
    rate: 0.00110            # thirst grows faster than hunger
    default:
      posture: MaintainAbove
      setpoint: 0.50
      referent: Self
    salience:
      curve: deficit
      gain: 1.1

  - id: Rest
    kind: consumable
    rate: 0.00045            # fatigue accrues across a waking day; cleared by Sleep
    default:
      posture: MaintainAbove
      setpoint: 0.45
      referent: Self
    salience:
      curve: deficit
      gain: 0.9

  - id: Safety
    kind: conditional        # driven by perceived threats / shelter, not by the clock
    rate: 0.0
    default:
      posture: PreventBelow
      setpoint: 0.40
      referent: Self          # may also target Place (a home) or Other (a child)
    salience:
      curve: deficit
      gain: 1.3              # threats spike salience hard (feeds Urgency -> Adrenaline)

  - id: Standing
    kind: conditional        # social standing; emerges from ToM distribution + reliance
    rate: 0.0
    default:
      posture: Maximize
      setpoint: 0.50
      referent: Self
    salience:
      curve: gap_to_max      # salience ~ (1 - level), weighted by Sociability at runtime
      gain: 0.7

  - id: Openness
    kind: conditional        # vista / view quality of the current place (drives 조망 disputes)
    rate: 0.0
    default:
      posture: Maximize
      setpoint: 0.35
      referent: Place
    salience:
      curve: gap_to_max
      gain: 0.5
