# content/needs.yaml — need / value dimension CATALOG (data-driven, D9 / D10)
#
# platform/config loads this into the engine/needs registry. A Value is
# {Dimension, Ref, Posture, Setpoint} (docs/glossary.md); the Dimensions it may
# target are defined here. Adding a dimension is a data change, no code.
#
# This file is the CATALOG only (which dimensions exist + posture/setpoint/salience).
# Per-need RATE constants for CONSUMABLE needs (decay_per_tick, satisfaction_threshold)
# live in content/balance.yaml's `needs:` block — the single tuning file — NOT here.
# engine/needs.Load merges the two; platform/config cross-checks that every consumable
# dimension below has a matching balance.yaml needs:<id> rate (and vice-versa).
#
# D9 — objects carry ONLY their satisfaction Effect (supply); see content/objects.yaml.
#      There is NO "future need" field anywhere. Demand is derived by the planner as
#      `rate x predicted-time` and forward-simulated; provisioning subgoals emerge.
#      Authors set ONLY the per-need rate (in balance.yaml) — never quantities or schedules.
#
# Schema: content/schema/needs.schema.json
#         (rate block schema: content/schema/balance.schema.json — `needs`)

schema_version: 1

# kind:
#   consumable  — the satisfaction level decays by time (rate in balance.yaml needs:<id>);
#                 the planner forward-rolls it and inserts provisioning when a setpoint
#                 breach is predicted. Replenished by an action Effect / object supply.
#   conditional — not time-driven; set by world/social state (threats, standing, terrain).
#                 No rate; not listed in the balance.yaml needs: block. Salience comes from
#                 the current gap to setpoint.
#
# default.* are the agent-generation defaults for a fresh Value on this Dimension;
# individual agents perturb setpoint by disposition (engine/values).
needs:
  - id: Satiety
    kind: consumable          # rate: balance.yaml needs.Satiety
    default:
      posture: MaintainAbove
      setpoint: 0.55
      referent: Self
    salience:
      curve: deficit          # salience ~ max(0, setpoint - level)
      gain: 1.0

  - id: Hydration
    kind: consumable          # rate: balance.yaml needs.Hydration
    default:
      posture: MaintainAbove
      setpoint: 0.50
      referent: Self
    salience:
      curve: deficit
      gain: 1.1

  - id: Rest
    kind: consumable          # rate: balance.yaml needs.Rest
    default:
      posture: MaintainAbove
      setpoint: 0.45
      referent: Self
    salience:
      curve: deficit
      gain: 0.9

  - id: Safety
    kind: conditional        # driven by perceived threats / shelter, not by the clock (no rate)
    default:
      posture: PreventBelow
      setpoint: 0.40
      referent: Self          # may also target Place (a home) or Other (a child)
    salience:
      curve: deficit
      gain: 1.3              # threats spike salience hard (feeds Urgency -> Adrenaline)

  - id: Standing
    kind: conditional        # social standing; emerges from ToM distribution + reliance (no rate)
    default:
      posture: Maximize
      setpoint: 0.50
      referent: Self
    salience:
      curve: gap_to_max      # salience ~ (1 - level), weighted by Sociability at runtime
      gain: 0.7

  - id: Openness
    kind: conditional        # vista / view quality of the current place (drives 조망 disputes; no rate)
    default:
      posture: Maximize
      setpoint: 0.35
      referent: Place
    salience:
      curve: gap_to_max
      gain: 0.5

  - id: Social
    kind: consumable          # rate: balance.yaml needs.Social; slow decay drives agents to seek others
    default:
      posture: MaintainAbove
      setpoint: 0.30
      referent: Self
    salience:
      curve: deficit
      gain: 0.6
