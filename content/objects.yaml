# content/objects.yaml — object & item kind catalog (data-driven, D9 / D10)
#
# This file is the concrete anchor of D9: "objects carry ONLY their satisfaction
# Effect (supply)." Each kind declares how much of which NEED it supplies and nothing
# about the future. Demand / provisioning is derived by the planner, never authored here.
#
# Two registries (loaded by platform/config; engine/world places instances per run):
#   object_kinds — in-world sources/structures (a bush, a spring, a shelter). They yield
#                  items and/or supply a need in-place. Positions & counts are NOT here —
#                  placement is per-run world-gen / scenario fixtures (docs/testing.md).
#   item_kinds   — carryable things held in Body.Inventory. The `supply` on the consumed
#                  item is the Effect that Eat/Drink delivers (so those actions stay generic).
#
# `supply` keys are need ids from content/needs.yaml; values are the amount delivered
# (clamped into the need range). `provides` keys are predicates (core.Pred) used by the
# GOAP reverse index. Schema: content/schema/objects.schema.json
#
# ── MATERIAL TAGS & RECIPES (Materials & Crafting plan; content/recipes.yaml) ────────
# A material is NOT a separate type — it is an item_kind carrying MATERIAL `tags` (D10 minimal
# extension, plan §0). A recipe input alternative is a TAG QUERY, not a specific item id:
# substitutability EMERGES from tags (D4) — any item whose `tags` is a superset of the query satisfies
# the slot, and a NEW item becomes a valid substitute purely by carrying the tag (no recipe edit).
# Tools carry a `tool:*` tag; stations (object_kinds) carry a `station:*` tag (the recipe `ambient`).
#
# ── TOOLS = DURABLES (Materials & Crafting plan §0 "Recipe model — FINAL"; engine/world apply) ──
# A tool item_kind carries a `tool:` block + its `tool:<family>` tag (the query vocabulary). The `tool:`
# block is JUST `{ wear_max }` — the durability CEILING. There is NO per-item `wear_per_use` (the wear
# AMOUNT is per-recipe: a recipe `wear`-mode alternative decrements the matched tool's CURRENT
# durability by that alternative's `amount`) and NO per-item `quality` formula (a produced tool's
# quality = its start durability, set by the crafting roll). Tools are NOT consumed by normal use: a
# `wear` alternative (Craft) or Mine decrements current durability by the amount; at 0 the tool is
# REMOVED (object-mortality, §7 — break = reaching 0). A produced tool's STARTING durability =
# basis_stat roll · wear_max (skilled crafters make sturdier tools). The per-tool-INSTANCE current
# durability is runtime state (data-contracts §9). A tool can also be CONSUMED as material (a `consume`
# alternative whose tagQuery matches it removes the whole instance — "칼 > 더 좋은 칼"). The Mine yield §6
# may read the held tool's quality (current durability / wear_max) via the world's `tool:<family>.quality`
# operand (Cm3). Bootstrap: `craft_basic_tool` has consume-only slots → bare-handed (no tool needed).
#
# ── DECAY (Materials & Crafting plan; engine/decay; mirrors flora's data-driven §6 shape) ─────
# A perishable item_kind carries a `decay` block: ordered discrete `states` (Q1: fresh→stale→
# rotten→gone), a per-state `threshold` in EFFECTIVE-DECAY-TIME units (Dm1(a): the lot's continuous
# `decayAge` accumulator crosses it; env-independent — acceleration shows up as a faster decayAge
# advance, not a moving threshold), a per-state `transform` (Q3: produces an item — D9 locality, decay
# does not vanish mass except at the terminal `gone` state), an optional per-state `supply` override
# (decayed food feeds less), a data `baseRate` (Q2: 기본 rate는 데이터), and an env-coupled `accel` §6
# Formula over the climate output operands `temperature`/`moisture` (Q2 환경결합). The effective rate
# composes MULTIPLICATIVELY (Dm2(a)): `effectiveRate = baseRate · accel(temperature,moisture) ·
# storageRateMult`, and `decayAge += elapsedTicks · effectiveRate` per decay step. The
# storage-structure rate multiplier (cold-storage 창발) is world-computed + injected, NOT authored on
# the item. engine/decay OWNS + evaluates the `accel` §6 Program via engine/expr (Dm3(a), flora parity).
# The decay UNIT is a LOT `{kind, qty, decayAge}` (Dm5(a)); lots never auto-merge; a kind's `{Tag:int}`
# inventory count is the SUM over its live lots. (Dm1–Dm5 are RESOLVED (a) — materials.md §1.)
#
# ── FINITE EXTRACTION SOURCES (Materials & Crafting Xm1 RESOLVED; engine/world + navmap apply) ──
# A mineral node (ore_node) is an object_kind carrying a `source:` block: a finite OBJECT-LOCAL
# `initial` count (D9 locality, berry_bush parity) — the runtime per-INSTANCE `remaining` (objects[]
# serialization, data-contracts §1) decremented by Mine. When `remaining` reaches 0 the world removes
# the node (object-mortality, §7) AND fires ONE navmap.SetTerrain over the node's cells to
# `depleted_terrain` (Xm2/Xm3 — one permanent reroute on exhaustion). The yield per Mine is the node's
# `harvest.yields` table rolled via §6(Dexterity, tool:digging.quality) (Xm5, flora-yield reuse). Q5
# 혼합: minerals are finite (this), water is infinite (`depletes:false`), flora regenerates (flora).
# ⚠ PREREQUISITE (Xm6): `depleted_terrain` (e.g. bare_rock) must exist in content/terrain.yaml + the
#   navmap `types` table (world+navmap M3) before the SetTerrain reroute golden — P_m4 scheduling.
#
# ── FLORA (engine/flora; docs/flora.md, design.md §5/§7) ─────────────────────────
# A flora species is an object_kind carrying a `flora:` block: the §6 formulas + thresholds
# that drive growth, suitability, propagation, shade, and death (object-mortality). flora
# objects are PLANTS (trees/bushes/grass) on continuous coords (D11) — NOT terrain, NOT a
# forest terrain type ("forest"/"dark forest" emerge from plant clusters + shade overlap, D2).
# All per-species behavior is §6 data here (no bespoke Go per-species function, D4/D10).
#
# MORPHOLOGY = TWO CONTINUOUS AXES (§1 refinement — replaced the single `growth` scalar):
#   length — plant HEIGHT (world units). Maturity proxy → discrete stages DERIVED via `stages`.
#            Wood/resource yield ∝ length (taller ⇒ more wood). Integrates with its OWN rate.
#   width  — plant girth / CANOPY spread (world units). Shade radius/opacity ∝ width.
#            Integrates with its OWN rate, INDEPENDENT of length — so a species can grow tall
#            faster than wide (pine vs oak). A grass/flower has tiny length AND tiny/no width.
#
#   flora.suitability  — §6 numeric formula over terrain attrs + climate (moisture/temperature)
#                        → [0,1]. Common driver of BOTH growth axes + (below death_threshold) death.
#   flora.length_rate  — §6/scalar: Length += length_rate · suitability per flora step (§1, 1b).
#   flora.width_rate   — §6/scalar: Width  += width_rate  · suitability per flora step (§1, 1b).
#   flora.stages       — ascending LENGTH thresholds (world units) → DERIVED discrete stage index
#                        (1b/§1; D9: no stored stage). yield_stage / propagate_stage gate stages.
#   flora.shade        — §6 formulas radius=f(width,species) + opacity=f(width,species) (1d/§1):
#                        shade scales with CANOPY (width), not height. perception composes
#                        overlapping shade ∏(1−opacity) into LoS (no tiling, D11).
#   flora.propagation  — radius + chance (§6; environmental, NOT a Dexterity stat): seed dispersal
#                        near the parent (1a); child spawns at p = chance · child_suitability ·
#                        density_weight(neighbor_count) within radius.
#   flora.death_threshold (θ) + flora.death_hysteresis — sustained suitability<θ for hysteresis
#                        steps → object-mortality removal (1b option a; no flicker).
#   harvest.yields     — the YIELD TABLE (1e): [{item, chance, qty:[min,max]}]. A generic action
#                        (Forage/Fell/Mine) rolls it with the seeded RNG; `chance = §6(Dexterity,
#                        tool-quality)` scales the per-entry success (D7: capability, not a per-action
#                        skill); the rolled qty further scales with `length` (flora §1). Regen is the
#                        yield refilling as length grows (flora) — NO future "amount ripening" field
#                        (D9), NO balance.regen.* timer for a flora species (regen is LOCAL to the
#                        object via its length + yield table).
#
# ⚠ MIGRATION (see SPEC Open Questions): the legacy `berry_bush` below stays a plain non-flora
#   object_kind (with balance.regen.berry_bush) through the flora-OFF phases so the live hunger-loop
#   goldens are untouched. The flora species `berry_shrub` is the generalized replacement; it is
#   DORMANT until flora is activated (no placement until activation). At activation (flora P_f4)
#   the deliberate re-baseline converts berry_bush → berry_shrub and drops balance.regen.berry_bush.
#
# ⚠ OPEN QUESTION (SPEC): whether shade-less / yield-less ground cover (grass) should be allowed to
#   OMIT `flora.shade` / `harvest` rather than author near-zero coefficients. Current schema requires
#   both, so `grass`/`wildflower` below author tiny/zero shade + (grass) no harvest table is modeled
#   by a Forage with a near-zero yield. Resolve before P_f4.

schema_version: 1

object_kinds:
  - id: berry_bush
    mobile: false
    harvest:
      action: Forage          # the atomic action that operates on this kind (actions.yaml)
      yields: berries         # item placed into inventory
      provides: [ has_food ]   # predicate made true for the GOAP planner
      depletes: true          # LEGACY finite + timer regrow (balance.regen.berry_bush). Superseded by
                              # the flora yield table on berry_shrub at activation (SPEC migration).

  # ── FLORA species (engine/flora) — DORMANT until activation; generalizes berry_bush ──
  # A bush that GROWS on two axes (continuous Length + Width), casts light shade (∝ width),
  # propagates by seed dispersal, and dies under sustained unsuitability. Its berry "regen" is the
  # yield table refilling as length grows, local to the object (D9) — NOT a balance.regen timer. The
  # §6 formula STRINGS below are compiled by platform/config via engine/expr (design.md §6); operands
  # are terrain attrs + climate + `length`/`width`/`Dexterity`. Values are illustrative placeholders
  # (untuned; balance is an auto-tuning target — see balance.yaml header).
  - id: berry_shrub
    mobile: false
    tags: [ scent:food, forage ]    # scent:food → world deposits the herbivore food channel; `forage` →
                                    # matched by a herbivore's fauna `diet` (deer grazes it). Fauna-OFF: inert.
    flora:
      suitability: "moisture*0.6 + (1 - temperature)*0.2 + (1 - slope)*0.2"  # §6 → [0,1]
      length_rate: 0.02             # Length += rate·suitability /step — modest height (a shrub) (1b/§1)
      width_rate:  0.025            # Width  += rate·suitability /step — slightly bushier than tall
      stages: [0.4, 0.9]            # ascending LENGTH (world units) → stage 0/1/2 (seedling/young/mature)
      yield_stage: 2                # only mature (stage ≥ 2) bears berries
      propagate_stage: 2            # only mature shrubs disperse seed
      shade:
        radius:  "width * 1.6"      # §6 → world units; shade scales with canopy spread = width (1d/§1)
        opacity: "width * 0.30"     # §6 → [0,1]; light shrub shade
      propagation:
        radius: 6.0                 # seed-dispersal radius around the parent Pos (1a)
        chance: 0.15                # base spawn probability · child_suitability · density_weight
      death_threshold: 0.20         # θ: suitability below this counts toward death (1b)
      death_hysteresis: 4           # consecutive sub-θ flora steps before removal (no flicker, 1b)
    harvest:
      action: Forage                # non-destructive harvest (does NOT kill the plant)
      provides: [ has_food ]
      yields:                       # YIELD TABLE (1e): seeded roll; chance = §6(Dexterity); qty ∝ length
        - { item: berries, chance: "0.5 + Dexterity*0.5", qty: [1, 3] }

  # A TREE: large on BOTH axes but TALLER than wide (length_rate > width_rate) — heavy shade (the
  # "dark forest" driver via canopy overlap), yields lots of wood when FELLED (destructive =
  # object-mortality, §7; qty ∝ length so a tall old oak gives more). Fell is the action that
  # triggers removal; a non-destructive Forage (e.g. fallen branches) could yield less without
  # killing it. (The Fell/Plant actions are not yet defined — SPEC Open Questions, human decision
  # before P_f4.)
  - id: oak
    mobile: false
    flora:
      suitability: "moisture*0.4 + (1 - salinity)*0.3 + (1 - slope)*0.3"
      length_rate: 0.010            # grows TALL (the dominant axis) but slowly — trees are slow
      width_rate:  0.006            # canopy widens more slowly than it rises → tall-but-broad oak
      stages: [2.0, 6.0]            # LENGTH thresholds (world units): sapling / young / mature tree
      yield_stage: 1                # young+ trees can be felled for wood
      propagate_stage: 2            # only mature trees seed
      shade:
        radius:  "width * 1.5"      # large canopy when wide (dark-forest overlap, 1d/§1)
        opacity: "width * 0.55"     # dense shade — clamped to [0,1] by the evaluator/perception
      propagation:
        radius: 12.0
        chance: 0.08
      death_threshold: 0.15
      death_hysteresis: 8           # trees are hardy — long hysteresis
    harvest:
      action: Fell                  # DESTRUCTIVE: removes the tree (object-mortality) on completion
      provides: [ has_materials ]   # wood feeds the craft/build chain (GOAP reverse index)
      yields:
        - { item: wood, chance: "0.7 + Dexterity*0.3", qty: [2, 5] }

  # GRASS: a low ground-cover. LOW length AND LOW width → effectively NO shade (radius ≈ 0) and a
  # tiny forage yield. Demonstrates the bottom-left of the shape space. (See the OPEN QUESTION in the
  # header: a true shade-less/yield-less ground cover may eventually OMIT shade/harvest entirely; for
  # now it authors near-zero coefficients so the required schema fields are satisfied.)
  - id: grass
    mobile: false
    tags: [ scent:food, forage ]    # primary grazing ground-cover: scent:food (herbivore homing) + `forage`
                                    # (deer diet match). Fauna-OFF: inert (no animals to read the channel).
    flora:
      suitability: "moisture*0.5 + (1 - slope)*0.3 + (1 - salinity)*0.2"
      length_rate: 0.05             # grows FAST but only a little (low ceiling reached quickly)
      width_rate:  0.04             # spreads a bit too, but stays a low tuft
      stages: [0.1, 0.3]            # LENGTH thresholds (world units): sprout / blade / tuft
      yield_stage: 2
      propagate_stage: 1            # grass spreads readily once established
      shade:
        radius:  "width * 0.05"     # negligible shade — a tuft does not occlude (1d/§1)
        opacity: "width * 0.02"
      propagation:
        radius: 3.0                 # spreads in tight clumps
        chance: 0.30                # but spreads readily (high base chance)
      death_threshold: 0.10         # hardy / weedy — tolerates poor sites
      death_hysteresis: 3
    harvest:
      action: Forage                # graze / gather; non-destructive
      provides: [ has_food ]
      yields:                       # tiny yield (mostly a ground-cover, qty ∝ length is small anyway)
        - { item: berries, chance: "0.1 + Dexterity*0.2", qty: [0, 1] }

  # WILDFLOWER: LOW length, MODERATE width (a spreading bloom wider than it is tall →
  # width_rate > length_rate). Casts a little shade from its spread but yields no harvest material
  # (no `harvest` block). The inverse shape of the oak: wide-but-short. Demonstrates a species whose
  # width drives shade while its height stays small (shade ∝ width, NOT length — §1 refinement).
  - id: wildflower
    mobile: false
    flora:
      suitability: "moisture*0.4 + temperature*0.3 + (1 - slope)*0.3"
      length_rate: 0.015            # stays short
      width_rate:  0.035            # spreads WIDER than tall → low-but-broad bloom
      stages: [0.15, 0.4]           # LENGTH thresholds (world units)
      yield_stage: 99               # bears no harvest material (no harvest block) — high gate is moot
      propagate_stage: 1
      shade:
        radius:  "width * 0.4"      # a little ground shade from the spread (1d/§1)
        opacity: "width * 0.10"     # faint
      propagation:
        radius: 5.0
        chance: 0.20
      death_threshold: 0.18
      death_hysteresis: 2           # flowers are short-lived / fragile

  # ── FAUNA species (engine/fauna; docs/fauna.md F1–F46) — DORMANT until fauna activation ──
  # An animal SPECIES = an object_kind carrying a `fauna:` block: the reduced-reactive controller's
  # per-species §6 table (candidate actions + per-action utility, drives, apparent_temp, speed, senses,
  # diet, per-species terrain cost). Behaviour EMERGES from §6 utility-max + drives + scent (D2/D3 — NO
  # behaviour tree, NO FSM). All per-species behaviour is §6/data (D4/D10). The predator flag is the
  # `threat:predator` tag (F8); scent emission is a `scent:<channel>` tag (world deposits by it, scent
  # SPEC); the animal is `mobile: true`. Drive ids double as lowercase §6 Attr operands (F27).
  # §6 strings are compiled by platform/config via engine/kernel/expr; valid operands are the fauna
  # AttrOperands() (scent.{food,prey,predator} · dist.{food,prey,predator} · sight.predator ·
  # apparent_temp · temperature · moisture · wind.dir · wind.mag · is_current) ∪ this species' drive ids
  # ∪ the Stat registry (UPPERCASE, content/stats.yaml). Values are UNTUNED placeholders (balance target).
  # Adding these re-baselines actions IDs()/Producers; until InstallFauna + a fixture places animals they
  # are inert (fauna-OFF neutrality lever). The legacy `prey`/Hunt object below is UNTOUCHED (agent hunt).
  # FUTURE (FA8): a swimmer/fish species (low river/sea terrain_cost, land in `impassable`) demonstrates
  # the per-species cost map further; deer+wolf already differ over river/mountain (W10b).

  # DEER — a wary herbivore (prey). Grazes vegetation (diet: forage); wary/flees from wolves via the
  # single `fear` value crossing §6 bands (F43). Emits `scent:prey` (wolves home in) + carries `game`
  # (the wolf diet match). WIDE FOV (prey vigilance, F44). Re-arbitrates on the F45 dormant cadence,
  # waking the tick wolf scent reaches its cell.
  - id: deer
    mobile: true
    tags: [ scent:prey, game ]
    fauna:
      actions:
        - { action: Graze,  utility: "hunger * (0.3 + scent.food) - fear * 1.5" }   # hungry → seek/crop food; fear suppresses
        - { action: Wary,   utility: "fear" }                                       # predator SCENT → vigilance band (F43)
        - { action: Flee,   utility: "(fear - 0.6) * 5" }                           # predator SIGHT (higher fear) → flight band (F43)
        - { action: Rest,   utility: "fatigue * 0.4 + thermal * 0.3 - hunger * 0.5 - fear * 2" }
        - { action: MoveTo, utility: "0.1" }                                        # wander baseline (lowest)
      drives:
        - { id: hunger,  rate: 0.0008 }                                             # accumulator (D9): ~0→1 over ~1250 ticks
        - { id: fatigue, rate: 0.0004 }
        - { id: fear,    decay: 0.05, wary_level: 0.5, flee_level: 1.0 }            # SET-from-context (F43); cools when clear
        - { id: thermal }                                                          # DERIVED from apparent_temp (F40); no rate
      apparent_temp: "temperature - wind.mag * 6 - moisture * 3"                    # °C felt: wind-chill + wet (CA3 °C); P1 climate-OFF ⇒ neutral
      speed: "Agility * 1.2 + fear * 0.8 - fatigue * 0.4 - thermal * 0.6"           # base Agility; fear→faster, fatigue/thermal→slower (체온→운동능력; thermal from apparent_temp F40, 0 under climate-OFF)
      graze: "0.06 + hunger * 0.05"                                                # §6 hunger recovered per graze tick at forage flora (world applyAnimalGraze; parallels predator feed)
      diet: [ forage ]                                                             # grazes objects carrying `forage` (grass/berry_shrub)
      senses: { smell_radius: 10.0, sight_radius: 14.0, fov_arc: 1.05 }             # wide FOV ~120° (prey vigilance, F44)
      terrain_cost: { river: 1.8, mountain: 1.6 }                                  # fords water / climbs poorly (W10b); absent terrain ⇒ 1.0
      impassable: [ sea ]                                                          # cannot enter deep sea (per-species block; sea also globally impassable)

  # WOLF — an apex predator (carnivore). Hunts deer (diet: game) by SCENT homing (scent.prey, upwind in
  # wind). Emits `scent:predator` (deer detect → Wary/Flee) + carries `threat:predator` (the predator
  # flag, F8). NO `fear` drive (apex). NARROW long-range FOV (focused pursuit, F44). Predators are always
  # ACTIVE (F45). Ranges over hills/water better than deer (lower terrain_cost), so pursuit can corner a
  # fleeing deer across terrain (W10b/FA8).
  - id: wolf
    mobile: true
    tags: [ threat:predator, scent:predator ]
    fauna:
      actions:
        - { action: Hunt,   utility: "hunger * (0.3 + scent.prey)" }                # hungry → home on prey scent (upwind, FA2)
        - { action: Attack, utility: "hunger * (0.8 + scent.prey) - dist.prey * 0.05 - target.threat * 0.7" } # close prey → engage; predator targets damped by threat cost
        - { action: Feed,   utility: "hunger * (0.4 + scent.carrion)" }             # hungry predator follows carrion and feeds after a kill
        - { action: Rest,   utility: "fatigue * 0.5 + thermal * 0.3 - hunger * 0.6" }
        - { action: MoveTo, utility: "0.15" }                                       # range/wander baseline
      drives:
        - { id: hunger,  rate: 0.0006 }
        - { id: fatigue, rate: 0.0005 }
        - { id: thermal }
      apparent_temp: "temperature - wind.mag * 5 - moisture * 2"
      speed: "Agility * 1.5 - fatigue * 0.5 - thermal * 0.5"                        # faster than deer (pursuit); thermal stress → slower (F40)
      attack_power: "Strength * 0.006"                                              # §6 damage magnitude from base stat composition (FC4)
      hit: "0.55 + Agility * 0.0045"                                                # §6 hit multiplier/probability proxy; target defense deferred to content operands
      feed: "0.35 + hunger * 0.45"                                                  # carcass supply → hunger recovery factor (FC8)
      diet: [ game ]                                                               # hunts animals carrying `game` (deer)
      senses: { smell_radius: 12.0, sight_radius: 20.0, fov_arc: 0.79 }             # narrow FOV ~90°, long range (F44)
      terrain_cost: { river: 1.4, mountain: 1.2 }                                  # ranges water/hills better than deer (W10b)
      impassable: [ sea ]

  # RABBIT — a small, twitchy herbivore prey. Same diet/tags as deer but tuned timid + FAST: high hunger
  # (small body eats often), near-panoramic FOV, low flee threshold (bolts early), poor at water/climbing.
  # A second prey for wolf/bear; demonstrates per-species TUNING variety over the same §6 shape (D4/D10).
  - id: rabbit
    mobile: true
    tags: [ scent:prey, game ]
    fauna:
      actions:
        - { action: Graze,  utility: "hunger * (0.3 + scent.food) - fear * 1.8" }   # eats often; strongly fear-suppressed
        - { action: Wary,   utility: "fear * 1.1" }
        - { action: Flee,   utility: "(fear - 0.5) * 6" }                           # bolts EARLY (low flee threshold)
        - { action: Rest,   utility: "fatigue * 0.4 + thermal * 0.3 - hunger * 0.5 - fear * 2.5" }
        - { action: MoveTo, utility: "0.1" }
      drives:
        - { id: hunger,  rate: 0.0012 }                                            # small body → eats often
        - { id: fatigue, rate: 0.0006 }
        - { id: fear,    decay: 0.04, wary_level: 0.6, flee_level: 1.0 }            # twitchier than deer
        - { id: thermal }
      apparent_temp: "temperature - wind.mag * 7 - moisture * 3"                    # small body → wind-chills fast
      speed: "Agility * 1.6 + fear * 1.0 - fatigue * 0.4 - thermal * 0.7"           # very fast sprinter; small body → strong thermal penalty (F40)
      graze: "0.07 + hunger * 0.05"                                                # §6 hunger recovered per graze tick at forage flora
      diet: [ forage ]
      senses: { smell_radius: 8.0, sight_radius: 16.0, fov_arc: 1.4 }               # near-panoramic FOV ~160°
      terrain_cost: { river: 2.5, mountain: 2.0 }                                  # poor at water + climbing (plains animal)
      impassable: [ sea ]

  # GOAT — a CLIMBER herbivore (FA8): cheap on `mountain` (terrain_cost < 1) so it ranges the highlands a
  # plains deer avoids; calmer (flees later, mountains are its refuge) + a hardy coat (low wind chill).
  - id: goat
    mobile: true
    tags: [ scent:prey, game ]
    fauna:
      actions:
        - { action: Graze,  utility: "hunger * (0.3 + scent.food) - fear * 1.2" }
        - { action: Wary,   utility: "fear * 0.9" }
        - { action: Flee,   utility: "(fear - 0.65) * 5" }                         # flees later than deer (mountain safety)
        - { action: Rest,   utility: "fatigue * 0.4 + thermal * 0.3 - hunger * 0.5 - fear * 1.8" }
        - { action: MoveTo, utility: "0.1" }
      drives:
        - { id: hunger,  rate: 0.0007 }
        - { id: fatigue, rate: 0.0004 }
        - { id: fear,    decay: 0.06, wary_level: 0.4, flee_level: 0.9 }
        - { id: thermal }
      apparent_temp: "temperature - wind.mag * 4 - moisture * 2"                    # hardy mountain coat
      speed: "Agility * 1.1 - fatigue * 0.3 - thermal * 0.3"                        # hardy mountain coat → small thermal penalty (F40)
      graze: "0.05 + hunger * 0.05"                                                # §6 hunger recovered per graze tick at forage flora
      diet: [ forage ]
      senses: { smell_radius: 9.0, sight_radius: 13.0, fov_arc: 1.0 }
      terrain_cost: { mountain: 0.6, river: 2.0, sand: 1.2 }                       # CLIMBER: cheap on mountains (FA8); poor at water
      impassable: [ sea ]

  # BEAR — an OMNIVORE apex (F7/D2): diet [game, forage] → it BOTH Hunts prey AND Grazes vegetation; which
  # one fires is the emergent §6 max (stronger of scent.prey vs scent.food). A 2nd predator (threat:predator
  # + scent:predator → prey now face two threats) and a CLIMBER (cheap on mountain, FA8). Big body → slow
  # hunger, strong-not-fast, superb nose, low wind chill. No `fear` (apex).
  - id: bear
    mobile: true
    tags: [ threat:predator, scent:predator ]
    fauna:
      actions:
        - { action: Hunt,   utility: "hunger * (0.2 + scent.prey)" }                # hunts when prey scent dominates
        - { action: Attack, utility: "hunger * (0.9 + scent.prey) - dist.prey * 0.04 - target.threat * 0.5" } # strong predator, still threat-damped
        - { action: Feed,   utility: "hunger * (0.35 + scent.carrion)" }            # scavenges/feeds from carcass scent
        - { action: Graze,  utility: "hunger * (0.2 + scent.food)" }                # grazes when food scent dominates (emergent omnivore)
        - { action: Rest,   utility: "fatigue * 0.5 + thermal * 0.3 - hunger * 0.6" }
        - { action: MoveTo, utility: "0.15" }
      drives:
        - { id: hunger,  rate: 0.0005 }                                            # large body → slow hunger
        - { id: fatigue, rate: 0.0004 }
        - { id: thermal }
      apparent_temp: "temperature - wind.mag * 3 - moisture * 1"                    # large, well-insulated
      speed: "Agility * 1.1 - fatigue * 0.4 - thermal * 0.25"                       # strong, not fast; well-insulated → smallest thermal penalty (F40)
      attack_power: "Strength * 0.008"                                              # heavier hit than wolf (FC4)
      hit: "0.5 + Agility * 0.0035"                                                 # less agile but still stat-composed
      feed: "0.4 + hunger * 0.4"                                                    # larger predator extracts more recovery from a carcass
      diet: [ game, forage ]                                                       # OMNIVORE: prey + vegetation (F7)
      senses: { smell_radius: 14.0, sight_radius: 16.0, fov_arc: 0.9 }              # superb nose
      terrain_cost: { mountain: 0.7, river: 1.5 }                                  # CLIMBER predator (FA8)
      impassable: [ sea ]

  # FISH — an AQUATIC prey (FA8 swimmer + impassable demo): cheap on `river`/`sea` (terrain_cost < 1) and
  # CANNOT leave the water (`impassable` = all land terrains) — the clearest per-species cost-map case. No
  # `hunger`/Graze/Hunt yet (aquatic foraging needs aquatic flora — DEFERRED); it drifts (MoveTo) + flees
  # predators that wade in (bear/wolf can enter river at cost). Demonstrates terrain-confined locomotion.
  - id: fish
    mobile: true
    tags: [ scent:prey, game ]
    fauna:
      actions:
        - { action: Wary,   utility: "fear * 0.8" }
        - { action: Flee,   utility: "(fear - 0.6) * 5" }
        - { action: Rest,   utility: "fatigue * 0.5 + thermal * 0.3 - fear * 2" }
        - { action: MoveTo, utility: "0.2" }                                        # mostly drifts/wanders in water
      drives:
        - { id: fatigue, rate: 0.0004 }
        - { id: fear,    decay: 0.06, wary_level: 0.5, flee_level: 1.0 }
        - { id: thermal }                                                          # (no hunger drive — aquatic foraging deferred)
      apparent_temp: "temperature - moisture * 1"                                   # in-water: negligible wind effect
      speed: "Agility * 1.3 - fatigue * 0.3 - thermal * 0.5"                        # cold-blooded → water temperature swings movement (F40)
      senses: { smell_radius: 7.0, sight_radius: 10.0, fov_arc: 1.2 }
      terrain_cost: { river: 0.5, sea: 0.5 }                                       # SWIMMER: fast in water (FA8)
      impassable: [ soil, sand, mountain, bare_rock ]                              # confined to water (FA8 impassable-on-land)

  - id: prey
    mobile: true              # wanders; perception + pursuit handled by engine
    harvest:
      action: Hunt
      yields: raw_meat
      provides: [ has_food ]
      depletes: true          # the animal instance is consumed

  - id: water_source
    mobile: false
    harvest:
      action: Drink
      yields: water           # may be drunk in place or carried
      provides: [ has_water, at_water ]
      depletes: false         # effectively unlimited (Q5/Xm3: water is the INFINITE source case)

  # ── ORE NODE (Materials P_m4 / Xm1) — finite mineral source; Mine target ──────────
  # A finite, scarce mineral node (Q5: 광물 = 유한·희소 → 고갈 → economy 분쟁 시드 D2). The finite
  # quantity is OBJECT-LOCAL (`source.initial` → runtime per-instance `remaining`, D9 locality, parity
  # with berry_bush). Mine (tool:digging-gated, Xm5) rolls the yield table via §6(Dexterity,
  # tool:digging.quality) (flora-yield reuse). On `remaining → 0` the world removes the node
  # (object-mortality) and fires ONE navmap.SetTerrain over its cells → `bare_rock` (Xm2/Xm3 — the
  # permanent reroute). ⚠ Xm6: `bare_rock` must exist in content/terrain.yaml + the navmap types table
  # (world+navmap M3) before the SetTerrain reroute golden. DORMANT until P_m4 placement.
  - id: ore_node
    mobile: false
    source:
      initial: 8                    # finite, scarce (Xm1/Q5): ~8 successful extractions before depletion
      depleted_terrain: bare_rock   # Xm3: the cells become this on exhaustion (one SetTerrain reroute)
    harvest:
      action: Mine                  # Xm4: parallel to flora Fell; tool:digging-gated (Xm5)
      provides: [ has_materials ]   # ore/stone feeds the craft/build chain (GOAP reverse index)
      yields:                       # YIELD TABLE (Xm5): seeded roll; chance = §6(Dexterity, tool quality)
        - { item: stone, chance: "0.6 + Dexterity*0.3", qty: [1, 2] }

  - id: tool_bench
    mobile: false
    # A crafting STATION. `station:bench` is the tag a recipe's `ambient` list references (FINAL — the
    # actor must be IN RANGE of an object carrying it; substitutable; NOT consumed). There is NO Craft
    # action target_tags any more — the station is bound via the recipe `ambient` + the spatial hash.
    tags: [ station:bench ]
    # NOTE (P_m3 re-baseline): Craft is recipe-mediated (actions.yaml), so the legacy `harvest.action:
    # Craft` shape here is no longer how Craft binds. The bench is an AMBIENT station (matched by tag),
    # not a harvestable kind. The harvest block is retained inert for the flora-OFF / pre-P_m3 goldens
    # and dropped at the P_m3 re-baseline (Materials §2).
    harvest:
      action: Craft
      yields: crafted_tool
      provides: [ has_tool ]
      depletes: false         # the bench is reusable

  - id: forge
    mobile: false
    # A second crafting STATION (a furnace/forge) carrying `station:forge` — the ambient tag a
    # metalworking recipe references. Demonstrates that `ambient` is substitutable across station
    # KINDS (a recipe needing `station:forge` binds to ANY object carrying it). No recipe uses it yet;
    # it exists so the `station:forge` ambient vocabulary is referenceable (D4/D10) and validates.
    tags: [ station:forge ]

  - id: shelter
    mobile: false
    # A structure that supplies needs in-place while occupied (no item yielded).
    occupy:
      provides: [ at_shelter ]
      supply: { Safety: 0.50, Rest: 0.10 }   # Effect applied per the occupying action

item_kinds:
  - id: berries
    stackable: true
    perishable: true
    supply: { Satiety: 0.25 }   # the Effect Eat delivers when this item is consumed (D9)
    # ── DECAY (Materials & Crafting; engine/decay) — Dm1–Dm5 RESOLVED (a) ──
    # Berries rot: fresh → stale (less filling) → rotten (a transform product) → gone. `threshold` is
    # in EFFECTIVE-DECAY-TIME units (Dm1(a)); the lot's `decayAge` accumulator crosses it. `accel` is a
    # multiplicative §6 multiplier over the climate output operands `temperature`/`moisture` (Dm2(a)):
    # warm+wet speeds rot, cold+dry slows it (cold-storage 창발). Numbers are illustrative placeholders
    # (untuned; balance is an auto-tuning target).
    decay:
      baseRate: 1.0                                       # effective-decay-time / tick at neutral env (Q2/Dm1)
      accel: "0.5 + temperature*1.0 + moisture*0.5"       # §6 multiplier over climate output (Q2/Dm2(a))
      states:
        - name: fresh                                     # index 0 = initial state (decayAge=0; omit threshold)
        - name: stale
          threshold: 0.4                                  # enters at decayAge ≥ 0.4 (effective-time, Dm1(a))
          supply: { Satiety: 0.15 }                       # decayed food feeds less (per-state supply override)
        - name: rotten
          threshold: 0.8
          supply: { Satiety: 0.0 }
          transform: [ { item: rotten_matter, qty: 1 } ]  # Q3: produces qty·lot.Qty (D9 locality), does not vanish
        - name: gone
          threshold: 1.0                                  # terminal: no transform = the only mass removal

  - id: raw_meat
    stackable: true
    perishable: true
    supply: { Satiety: 0.55 }   # richer than berries -> the planner prefers it when available
    # Meat spoils faster than berries (higher baseRate); same RESOLVED (a) semantics as berries.
    decay:
      baseRate: 1.6
      accel: "0.5 + temperature*1.2 + moisture*0.6"
      states:
        - name: fresh
        - name: stale
          threshold: 0.3
          supply: { Satiety: 0.35 }
        - name: rotten
          threshold: 0.6
          supply: { Satiety: 0.0 }
          transform: [ { item: rotten_matter, qty: 1 } ]
        - name: gone
          threshold: 1.0

  - id: carcass
    stackable: false
    perishable: true
    tags: [ scent:carrion ]
    supply: { Satiety: 0.70 }   # live carrion supply; world Feed scales it by the species feed §6
    decay:
      baseRate: 0.8
      accel: "0.4 + temperature*0.04 + moisture*0.4"
      states:
        - name: fresh
          supply: { Satiety: 0.70 }
        - name: rotting
          threshold: 0.45
          supply: { Satiety: 0.35 }
        - name: bones
          threshold: 0.85
          supply: { Satiety: 0.05 }
          transform:
            - { item: bone, qty: 1 }
            - { item: hide, qty: 1 }
            - { item: sinew, qty: 1 }
        - name: gone
          threshold: 1.0

  - id: water
    stackable: true
    perishable: false
    supply: { Hydration: 0.45 }

  - id: wood
    stackable: true
    perishable: false
    # Felled-tree yield (flora). Instrumental material (feeds craft/build); like crafted_tool its
    # supply is a tiny Standing contribution (D9 requires a supply Effect; wood is not consumed for
    # need-satisfaction). Its real value is enabling Craft/Build via has_materials.
    # MATERIAL TAGS (Materials plan §0/D4): wood is BOTH shaft + (split) blade stock — so it satisfies
    # either recipe slot, and any other item carrying these tags substitutes for it automatically.
    tags: [ shaft_stock, blade_stock ]
    supply: { Standing: 0.02 }

  - id: bone
    stackable: true
    perishable: false
    # A substitutable material (Materials plan §0/D4 demonstration): bone ALSO carries `shaft_stock`,
    # so `craft_basic_tool` accepts wood OR bone in the shaft slot with no recipe change — the
    # substitutability emerges from the shared tag. (A felled-prey / butchery yield in a later phase.)
    tags: [ shaft_stock ]
    supply: { Standing: 0.01 }

  - id: hide
    stackable: true
    perishable: false
    # Butchery/carcass material: flexible sheet stock for later clothing, shelter, and containers.
    tags: [ sheet_stock ]
    supply: { Standing: 0.01 }

  - id: sinew
    stackable: true
    perishable: false
    # Butchery/carcass material: strong binding fiber, substitutable with cordage in later recipes.
    tags: [ binding_stock ]
    supply: { Standing: 0.01 }

  - id: stone
    stackable: true
    perishable: false
    # Another substitutable material: stone carries `blade_stock` (a sharp edge), so it substitutes
    # for split wood in the blade slot (D4 emergence). The Mine (P_m4) yield off an ore_node (Xm5).
    tags: [ blade_stock ]
    supply: { Standing: 0.01 }

  - id: cordage
    stackable: true
    perishable: false
    # A PARTIAL-USE / binding material (the thread-like example): twine/cord that hafts a tool head.
    # `binding_stock` is the tag `craft_pickaxe` queries at a SMALL `amount` (1) drawn from a larger lot
    # — a consume alternative does not have to take a whole lot (the lot keeps the remainder). (A later
    # phase yields cordage from plant fiber / sinew; for now it is a placeholder material.)
    tags: [ binding_stock ]
    supply: { Standing: 0.0 }

  - id: rotten_matter
    stackable: true
    perishable: false
    # The DECAY TRANSFORM PRODUCT (Q3): rotten food becomes this (compost/refuse) rather than
    # vanishing (D9 locality — decay produces an item, not nothing). Inert supply; its eventual use
    # (fertilizer/compost) is a later-phase content concern. Not itself perishable (a terminal product).
    supply: { Standing: 0.0 }

  - id: crafted_tool
    stackable: false           # a tool is a per-INSTANCE durable (not a stackable count)
    perishable: false          # tools do not rot; they WEAR (the `tool:` block), distinct from decay
    # A crafted (cutting) tool. TOOL TAG (D4): `tool:cutting` is the query a recipe `wear` alternative
    # matches (e.g. craft_pickaxe), or a Mine-style action tag would match (FINAL — no Craft action tag).
    # TOOL DURABLE (FINAL): the `tool:` block is JUST `wear_max` (the durability CEILING). A recipe
    # `wear` alternative decrements this instance's CURRENT durability by that alternative's `amount`;
    # at 0 it breaks (object-mortality, §7). A freshly crafted tool's START durability = the crafting
    # basis_stat roll · wear_max (skilled → sturdier). There is NO per-item wear_per_use or quality
    # formula (output quality = start durability from the roll). Numbers untuned.
    tags: [ tool:cutting ]
    tool:
      wear_max: 20             # durability ceiling; a fresh tool starts at roll·20 (skill-dependent)
    supply: { Standing: 0.05 }

  - id: pickaxe
    stackable: false           # per-instance durable
    perishable: false          # wears, does not rot
    # The Mine tool (P_m4/Xm5): `tool:digging` is the action-level tag gating Mine (the actor must HOLD
    # a pickaxe). Craftable via `craft_pickaxe` (content/recipes.yaml), which WEARS a held cutting tool
    # (mode: wear) — closing the toolmaking dependency (D2): you must already hold a cutting tool to make
    # a pickaxe, and a pickaxe to mine. Mining decrements this instance's CURRENT durability (the Mine
    # apply uses the same wear path; amount is the action's wear rate); at 0 it breaks. START durability
    # = craft basis_stat roll · wear_max. The Mine yield §6 reads `tool:digging.quality` (= current
    # durability / wear_max). FINAL: `tool:` is just wear_max (no per-item wear_per_use/quality). Untuned.
    tags: [ tool:digging ]
    tool:
      wear_max: 25             # durability ceiling; a fresh pickaxe starts at roll·25
    supply: { Standing: 0.05 }
