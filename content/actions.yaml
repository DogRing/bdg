# content/actions.yaml — atomic action catalog (data-driven, D3 / D4 / D10)
#
# D3 — define ONLY atomic, durative actions here. No task trees, no methods, no plans.
#      The planner assembles paths (HTN methods + GOAP backward chaining over `produces`).
# D4 — cost and gates are DERIVED FROM TAGS, never written per-action. An action lists
#      `tags`; gates.yaml matches tags to decide visibility/cost; balance.yaml gives the
#      magnitude of each tag level and the cost-term weights. No bespoke cost here.
#      THERE IS NO PER-ACTION `gates:` LIST AND NO PER-ACTION `cost:` FIELD — both would
#      reintroduce per-action wiring forbidden by D4. Gates are tag-matched in gates.yaml;
#      cost is composed from tags in the planner (balance.yaml cost_terms × tag_levels).
# D9 — consumption actions deliver the CONSUMED item's supply (objects.yaml). Self-sourced
#      effects (sleep) use `effect_per_minute`. Never author quantities tied to the future.
#
# Fields:
#   tags             — drives cost & gates (D4). Tag grammar: content/README.md §Tags.
#   requires         — predicates (core.Pred) that must hold to start (planner preconditions).
#   produces         — predicates this action makes true (engine/actions reverse index, GOAP).
#   target_kind      — object_kind (objects.yaml) this action operates on, if any.
#   recipe_mediated  — Materials plan §0 "Recipe model — FINAL"/D3: true marks an action (Craft)
#                      parameterized by a content/recipes.yaml RECIPE bound at plan time. The recipe's
#                      slot/alternative inputs (wear|consume), `ambient` stations, `duration`,
#                      `basis_stat`, and outputs drive everything. Such an action carries NO tool tag,
#                      NO station target, and NO `duration` (the recipe supplies it). MUST NOT set
#                      produces_item.
#   produces_item    — item placed into Body.Inventory on completion (a FIXED single item).
#   consumes_item    — item removed from inventory; its `supply` becomes the Effect (D9).
#   duration         — BASE durative length in game-minutes; engine scales by stats/distance. OMITTED
#                      for a recipe_mediated action (the recipe's per-recipe duration is used).
#   effect           — direct need deltas applied on completion (omit for consumption actions).
#   effect_per_minute— need deltas accrued each game-minute the action runs (durative supply).
#   interruptible    — durative actions are interruptible unless false (FR: durative + 중단 가능).
#
# Predicate binding (at_target / has_food …) is parametric; the planner binds the concrete
# object instance. Schema: content/schema/actions.schema.json
#
# Target kind (brief mapping): an action's TARGET is expressed by `target_kind`
#   • none        → no target_kind and no requires-at-target (e.g. Rest, Sleep)
#   • location    → MoveTo (binds a Vec2 destination via the at_target predicate)
#   • object      → target_kind names an objects.yaml object_kind (Forage, Mine, Eat-via-item …)
#   • agent       → target is another agent; expressed by the near_other predicate (Hunt, Signal,
#                   Attack). "Animal" targets (Hunt prey) are object_kinds tagged as creatures.
#   A recipe_mediated action (Craft) has NO target_kind — its station(s) are the recipe's `ambient`
#   tags, bound IN-RANGE via the spatial hash by the world (FINAL — no action target/station field).
#
# TOOLS — two routes (Materials plan §0 "Recipe model — FINAL"):
#   • A RECIPE-MEDIATED action (Craft): a tool is a recipe INPUT alternative with `mode: wear` (the
#     matched held tool's CURRENT durability is decremented by that alternative's `amount`; break at 0;
#     else persists). NO action tool tag. A tool can also be a `mode: consume` alternative (consumed as
#     material — whole instance removed). The craftable gate reads the bound recipe.
#   • A NON-recipe action (Mine): the tool requirement IS an action-level `tool:<family>` tag (the actor
#     must HOLD a matching tool). The world apply phase WEARS that held tool the same way (decrement
#     current durability, break at 0); the per-use wear AMOUNT is a world/balance rate for the action
#     (like navmap WearOnUse) — NOT a per-item field (FINAL removed per-item wear_per_use). Mine keeps
#     `tool:digging` this way (it is not recipe-mediated).

schema_version: 1

actions:
  # ── Locomotion ───────────────────────────────────────────────────────────────
  - id: MoveTo
    tags: [ "uses:Agility", "effort:low", "noise:low", "time:by_distance" ]
    produces: [ at_target ]            # parametric: the planner binds which target
    duration: 1                        # per-step base; completion is ARRIVAL-based (engine/world): the
                                       # agent steps toward Intent.Move each tick and the action ends
                                       # when it is within ArrivalEpsilon of the destination, so travel
                                       # time scales with distance. duration is only the safety cap.
    interruptible: true

  # Approach is the social counterpart to MoveTo. It produces `near_other` — the
  # precondition EVERY social/cooperative action requires (Offer, Trade, Comfort,
  # Feed, Vote, Report, …). Without it, `near_other` had NO producer, so it was only
  # ever satisfied by chance proximity and the entire social / emergence layer could
  # never be PLANNED, only stumbled into. With Approach the planner prepends a path to
  # the nearest agent exactly the way it prepends MoveTo for `at_target`. D3: atomic
  # locomotion; the agent binds the concrete target agent (nearest), not the YAML.
  - id: Approach
    tags: [ "uses:Agility", "effort:low", "noise:low", "time:by_distance" ]
    produces: [ near_other ]           # the action IS the move toward another agent
    duration: 1                        # per-step base; arrival-based completion (see MoveTo)
    interruptible: true

  # ── Fauna behaviour (engine/fauna; docs/fauna.md F26/F28/F43) ─────────────────
  # SHARED atomic actions the reduced-reactive ANIMAL controller scores by §6 utility — NOT the GOAP
  # planner (F1/F26: horizon-1 max over per-(species×action) utility, no behaviour tree, D3). They live
  # in the SHARED registry (D3 single action vocabulary), so adding them is a deliberate IDs()/Producers
  # re-baseline (fauna SPEC Out of Scope). Their `produces` predicates are fauna-internal markers — NO
  # agent goal references them, so the agent planner never chains to them (scored ONLY by fauna §6
  # utility). The hunger/fear/fatigue DRIVE effect of enacting one (Graze→hunger↓, Rest→fatigue↓) is
  # layered by the world fauna-apply (P_fa2), NOT a need `effect` here (drives ≠ needs, D5). The steer
  # CHANNEL per action is the fauna controller's STEER step (Graze→toward scent.food; Flee/Wary→away
  # from the predator), not authored here. DORMANT until InstallFauna + a fixture places animals.

  # Graze — herbivore feeding: seek + crop vegetation. The controller steers toward the scent.food
  # gradient; at a forage source the world applies hunger↓ (P_fa2). Combined seek+feed (FA1 Graze loop).
  - id: Graze
    tags: [ "uses:Agility", "effort:low", "noise:low", "abstraction:low" ]
    produces: [ grazed ]
    duration: 10
    interruptible: true

  # Flee — full-speed flight from a SEEN predator (sight.predator → fear in the Flee band, F43). The §6
  # speed program amplifies with fear; the controller steers directly away from the predator. Short
  # bursts (re-arbitrated each ACTIVE tick). NOT a wary→flee FSM transition — one continuous fear (D3).
  - id: Flee
    tags: [ "uses:Agility", "effort:high", "noise:med" ]
    produces: [ fled ]
    duration: 3
    interruptible: true

  # Wary — low-commitment vigilance: interrupt grazing, raise alertness, drift slowly away from predator
  # SCENT (scent.predator → fear in the Wary band, F43). Distinct from Flee ONLY by which fear §6 band
  # the single fear value crosses (emergent, not coded, D3). Slow away-from-scent movement.
  - id: Wary
    tags: [ "uses:Agility", "effort:low", "noise:low", "abstraction:low" ]
    produces: [ evaded ]
    duration: 5
    interruptible: true

  # ── Subsistence (the P1 hunger loop) ─────────────────────────────────────────
  - id: Forage
    tags: [ "uses:Agility", "effort:low", "noise:low", "abstraction:low" ]
    target_kind: berry_bush
    requires: [ at_target ]
    produces: [ has_food ]
    produces_item: berries
    duration: 12
    interruptible: true

  - id: Hunt
    tags: [ "uses:Strength", "uses:Agility", "effort:high", "noise:high",
            "risk:med", "violent:low", "abstraction:med" ]
    target_kind: prey
    requires: [ at_target ]
    produces: [ has_food ]
    produces_item: raw_meat
    duration: 35
    interruptible: true

  - id: Eat
    tags: [ "effort:low" ]
    requires: [ has_food ]
    produces: [ has_Satiety ]
    duration: 6
    effect: { Satiety: 0.40 }         # P1: direct effect (item-supply chain deferred)
    interruptible: true

  - id: Drink
    tags: [ "effort:none" ]
    target_kind: water_source
    requires: [ at_target ]            # P1: reached via MoveTo (at_water alias deferred)
    produces: [ has_Hydration ]
    duration: 3
    effect: { Hydration: 0.50 }       # P1: direct effect (item-supply chain deferred)
    interruptible: true

  # ── Recovery ─────────────────────────────────────────────────────────────────
  - id: Sleep
    tags: [ "effort:none", "risk:low" ]   # vulnerable while sleeping -> Safety gate matters
    duration: 360
    produces: [ has_Rest ]
    effect_per_minute: { Rest: 0.0030 }
    interruptible: true

  - id: Rest
    tags: [ "effort:none" ]
    duration: 30
    produces: [ has_Rest ]
    effect_per_minute: { Rest: 0.0010 }   # weaker than Sleep; tops up Stamina between tasks
    interruptible: true

  - id: TakeShelter
    tags: [ "effort:none", "abstraction:low" ]
    target_kind: shelter
    requires: [ at_shelter ]
    produces: [ sheltered ]
    # Effect comes from the shelter's `occupy.supply` (objects.yaml), applied while occupied.
    duration: 1
    interruptible: true

  # ── Handling / inventory ─────────────────────────────────────────────────────
  - id: PickUp
    tags: [ "effort:low", "noise:low" ]
    requires: [ at_target ]
    produces: [ holding ]
    duration: 2
    interruptible: true

  # ── Social (intent / will exchange — "대화", not natural language) ─────────────
  - id: Signal
    tags: [ "social", "effort:none", "abstraction:med" ]
    requires: [ near_other ]
    produces: [ signalled ]            # emits Signal{Kind,Intent,Valence,ClaimedValue,Truth}
    duration: 3
    interruptible: true

  # ── Trade negotiation (P2 — atomic negotiation protocol) ─────────────────────
  # Offer → AcceptTrade (tradeComplete) or RejectTrade (tradeRejected)
  # D3: each step is atomic; the planner chains them via predicates.
  # D4: cost/visibility from tags only — no per-action cost or norm field.
  - id: Offer
    tags: [ "social", "effort:low", "abstraction:low" ]
    requires: [ near_other ]
    produces: [ has_Social, tradeOffered ]
    duration: 3
    effect: { Social: 0.35 }           # social interaction satisfies part of Social need
    interruptible: true

  - id: AcceptTrade
    tags: [ "social", "cooperative", "effort:none" ]
    requires: [ near_other, tradeOffered ]
    produces: [ has_Social, tradeComplete ]
    duration: 2
    effect: { Social: 0.35 }           # completing the trade satisfies Social need
    interruptible: false               # committed once begun

  - id: RejectTrade
    tags: [ "social", "effort:none" ]
    requires: [ near_other, tradeOffered ]
    produces: [ tradeRejected ]
    duration: 1
    interruptible: true

  - id: GiveItem
    tags: [ "social", "cooperative", "effort:low" ]
    requires: [ near_other, holding ]
    produces: [ transferred ]
    consumes_item: any                 # moves item to the Other's inventory
    duration: 2
    interruptible: true

  - id: Trade
    tags: [ "social", "cooperative", "effort:low", "abstraction:high" ]
    requires: [ near_other, holding ]
    produces: [ transferred ]
    duration: 6
    interruptible: true

  # ── Extraction / mining (Materials P_m4) ──────────────────────────────────────
  # Mine is the parallel to flora's Fell (destructive-on-depletion) — distinct from Forage
  # (non-destructive food) so gates/cost/tool differ (D4, Xm4). It targets a finite-qty
  # ore_node object_kind (Xm1: object-local `remaining`, D9 — berry_bush parity), and is
  # TOOL-GATED on `tool:digging` (a pickaxe; Xm5) — an ACTION-LEVEL tag (Mine is NOT
  # recipe-mediated): invisible/un-startable without holding a pickaxe. The world apply phase
  # WEARS the held digging tool (decrement current durability, break at 0 — same path as a recipe
  # `wear` alternative); the per-use wear AMOUNT is a world/balance rate for Mine (like navmap
  # WearOnUse), since Mine has no recipe and the FINAL `tool:` block has no per-item wear amount.
  # The node's yield table + §6(Dexterity, tool-quality) roll (flora-yield reuse, Xm5) + the
  # remaining-→0 → object-mortality removal + ONE navmap.SetTerrain reroute (Xm2/Xm3) are the
  # world apply phase, NOT on this action. D3: atomic; the gather chain is planner-assembled.
  # PREREQUISITE (Xm6): the SetTerrain reroute needs content/terrain.yaml + a depleted/bare_rock
  # terrain type to exist (world+navmap M3); P_m4 is scheduled after those.
  - id: Mine
    tags: [ "uses:Strength", "effort:high", "noise:med", "tool:digging", "abstraction:low" ]
    target_kind: ore_node
    requires: [ at_target ]
    produces: [ has_materials ]        # ore/stone feeds the craft/build chain (GOAP reverse index)
    duration: 45
    interruptible: true

  # ── Crafting / construction (P1 craft loop + P6 emergent building) ────────────
  # Craft is the recipe-mediated atomic craft action (Materials P_m3, "Recipe model — FINAL"). D3: it
  # is ATOMIC and PARAMETERIZED by a content/recipes.yaml recipe bound at plan time (recipe_mediated:
  # true). The recipe owns EVERYTHING: ordered input SLOTS (each `{any:[alternative…]}`, first
  # satisfiable in authored order; alternative `{tagQuery, amount, mode: wear|consume}`), `ambient`
  # station tags (in-range via the spatial hash — NO action target/station field), per-recipe
  # `duration` (so the action carries NO duration), `basis_stat` (the outcome roll), and outputs. It
  # USES Intelligence (capability_floor gate) + is abstraction:med (knowledge gate) so a
  # low-Intelligence agent cannot SEE it (D8). Craft has NO tool tag — a tool requirement is a `wear`
  # (or `consume`) recipe alternative; a tool-free recipe (craft_basic_tool) is bare-handed (bootstrap).
  # The world apply phase: per slot takes the FIRST satisfiable alternative (D12) and applies its mode
  # (consume = remove `amount`, most-decayed lots first ties by ObjectID; wear = decrement the
  # most-worn matching tool by `amount`, break at 0); checks every `ambient` station in range; rolls
  # the outcome (success, qty, AND produced-instance durability) from `basis_stat` (produced tool start
  # durability = roll·wear_max); places a perishable output as a fresh decay lot {kind,qty,decayAge=0}
  # (Dm5); and does NOT half-run on an unsatisfiable slot/ambient (no partial consumption). D4: no
  # per-action cost — tags drive it. The gather→craft chain is planner-assembled; this entry hand-draws
  # no tree.
  - id: Craft
    tags: [ "uses:Intelligence", "effort:high", "noise:low", "abstraction:med" ]
    recipe_mediated: true              # FINAL/D3: parameterized by a recipes.yaml recipe at plan time
    requires: [ has_materials ]        # generic "recipe inputs are satisfiable" precondition
    produces: [ has_tool ]
    # NO duration — the bound recipe's per-recipe `duration` is used (FINAL).
    interruptible: true

  - id: Build
    tags: [ "uses:Strength", "effort:high", "noise:med", "cooperative", "abstraction:high" ]
    requires: [ at_target, has_materials ]
    produces: [ structure_built ]      # may instantiate a shelter object_kind
    duration: 240
    interruptible: true

  # ── Transgressive (NOT hardcoded crime, D2 — just atomic acts the conscience gate
  #    suppresses; they become visible only when drive overcomes the barrier, design §3) ──
  - id: Take
    tags: [ "effort:low", "noise:low", "norm:transgressive", "risk:med", "social:covert" ]
    requires: [ near_other, owned_by_other ]
    produces: [ holding, has_food ]    # taking an owned food item; has_food satisfies Eat's precondition
    duration: 4
    interruptible: true

  - id: Attack
    tags: [ "uses:Strength", "effort:high", "noise:high", "violent:high",
            "norm:transgressive", "risk:high" ]
    requires: [ near_other ]
    produces: [ has_Safety ]            # deterrence/coercion: satisfies a defensive Safety goal
    duration: 5
    interruptible: false               # committed once swung

  # Social care (P5 — Scenario D parent-feed-child)
  - id: Cook
    tags: [ "uses:Intelligence", "effort:med", "noise:low", "abstraction:med" ]
    target_kind: fire_pit
    requires: [ at_target, has_raw_food ]
    produces: [ has_cooked_food ]
    duration: 20
    interruptible: true

  - id: Comfort
    tags: [ "social", "effort:low", "abstraction:med" ]
    requires: [ near_other ]
    produces: [ comforted, has_Comfort ]   # has_Comfort is the Comfort-dimension producer the planner
                                           # resolves a Comfort goal to (dimensionToProducerPredicate);
                                           # without it the Comfort need had NO satisfier and could only
                                           # be suppressed (band-aid decay), never pursued.
    duration: 15
    effect: { Comfort: 0.40 }              # a comforting interaction satisfies the Comfort need (D9 self-effect)
    interruptible: true

  - id: Feed
    tags: [ "social", "effort:low", "abstraction:med" ]
    requires: [ near_other, has_food ]
    produces: [ comforted, sated ]
    duration: 8
    interruptible: true

  # ── Public safety (P5 — Scenario G prerequisite) ─────────────────────────────
  # Patrol is a low-abstraction vigilance action taken when collective safety is low.
  # It produces `has_Safety` — the Safety-dimension producer predicate the planner
  # resolves a Safety goal to (dimensionToProducerPredicate) — so a defensive Safety
  # goal reaches Patrol; `public_safety` is kept as the collective-state marker. The
  # location precondition is `at_target` (satisfied by MoveTo to the village_center,
  # matching Forage→berry_bush); `near_target` had no producer and was unreachable.
  - id: Patrol
    tags: [ "uses:Agility", "effort:med", "noise:low", "abstraction:low" ]
    target_kind: village_center
    requires: [ at_target ]
    produces: [ public_safety, has_Safety ]
    effect: { Safety: 0.15 }
    duration: 12
    interruptible: true

  # Report is a social action for alerting other agents to a threat. It requires being
  # near another agent and produces an "alerted" predicate that can trigger downstream
  # collective response (Scenario G: village chief emergence requires alert propagation).
  - id: Report
    tags: [ "social", "effort:low", "abstraction:med" ]
    requires: [ near_other ]
    produces: [ alerted ]
    duration: 5
    interruptible: true

  # ── Delegation (P6 — emergent institutions) ──────────────────────────────────
  # Vote publicly delegates a Function (safety/judgment/knowledge) to a target: a social
  # signal that lets reliance (RelyOn) converge faster than private accretion under shared
  # distress. It carries no need Effect — it never competes with survival goals — and is
  # NOT a role/institution (D2): the emergent role is the RelyOn cluster engine/world detects.
  # The delegated Function rides on the emitted Signal (core.Signal.Function), not on a tag.
  - id: Vote
    tags: [ "social", "effort:low", "abstraction:high" ]
    requires: [ near_other ]
    produces: [ voted ]
    duration: 3
    interruptible: true
