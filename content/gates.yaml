# content/gates.yaml — gate registry (data-driven, D4 / D10), predicate-tree form
#
# A Gate is a PRECONDITION on actions: {id, tags:[Tag…], expr}. It is matched to actions BY TAG
# (D4) — the gate applies to a candidate action iff the action carries ANY tag in `tags`
# (omit/empty = applies to all). For a matched action the gate's boolean `expr` is evaluated
# against the agent snapshot (ToM[self] stats, D8) plus the action's own tags. An action is
# VISIBLE to the agent iff EVERY matching gate's expr is true (hard AND across matching gates).
# Gates are evaluated AT PLANNING TIME and are NEVER stored on objects/goals (D5).
#
# expr grammar (recursive):
#   leaf:       { stat: <StatID>, op: ">="|">"|"<="|"<"|"=="|"!=", value: <number> }
#                 — compares the agent's ToM[self] value of <StatID> against <value> (D8:
#                   decisions read self-belief, never Real Stats; gates do not correct it).
#               { body: <BodyScalar>, op, value }
#                 — compares the live Body scalar (Stamina|Mood|Adrenaline|Urgency) (NEW v3).
#               { tag: <Tag> }
#                 — true iff the candidate action carries exactly <Tag>.
#   composite:  { and: [expr…] }   true iff every child is true
#               { or:  [expr…] }   true iff any child is true
#               { not: expr }      true iff the child is false
#
# NEW v3: A gate may carry an optional `cost_rule: { mult: <positive number> }`. A gate with a
# cost_rule uses its `expr` as the rule-fire condition (emit Mult when true), and its visibility
# verdict is ALWAYS true (it never hides an action). Gates WITHOUT a cost_rule are normal
# visibility gates. The planner's cost for a candidate action is multiplied by the PRODUCT of
# matching cost-rule gates' multipliers.
#
# Schema: content/schema/gates.schema.json (schema_version 3).

schema_version: 3

gates:
  # ── capability_floor (P1/P2, kept verbatim) ──────────────────────────────
  - id: capability_floor
    tags: [ "uses:Strength", "uses:Agility", "uses:Intelligence" ]
    expr:
      and:
        - or: [ { not: { tag: "uses:Strength" } },     { stat: Strength,     op: ">=", value: 0.15 } ]
        - or: [ { not: { tag: "uses:Agility" } },       { stat: Agility,      op: ">=", value: 0.15 } ]
        - or: [ { not: { tag: "uses:Intelligence" } },  { stat: Intelligence, op: ">=", value: 0.15 } ]

  # ── knowledge (P1/P2, kept verbatim) ─────────────────────────────────────
  - id: knowledge
    tags: [ "abstraction:low", "abstraction:med", "abstraction:high" ]
    expr:
      or:
        - and: [ { tag: "abstraction:low" },  { stat: Intelligence, op: ">=", value: 0.20 } ]
        - and: [ { tag: "abstraction:med" },  { stat: Intelligence, op: ">=", value: 0.45 } ]
        - and: [ { tag: "abstraction:high" }, { stat: Intelligence, op: ">=", value: 0.70 } ]

  # ── conscience: base predicate kept + urgency-relief OR branch (P3) ───────
  - id: conscience
    tags: [ "norm:transgressive" ]
    expr:
      or:
        # base barrier (v2, unchanged): dispositional drive overrides the norm
        - { stat: Honesty,    op: "<",  value: 0.40 }
        - { stat: Aggression, op: ">=", value: 0.65 }
        # P3 urgency relief: under pressure the barrier lowers (scenario B)
        - and:
            - { body: Urgency, op: ">", value: 0.70 }   # gates.conscience_urgency_threshold
            - or:
                - { stat: Honesty,    op: "<",  value: 0.55 }
                - { stat: Aggression, op: ">=", value: 0.50 }

  # ── stamina (P3): effort:high requires Stamina >= 0.20 ────────────────────
  - id: stamina
    tags: [ "effort:high" ]
    expr:
      or:
        - { not: { tag: "effort:high" } }
        - { body: Stamina, op: ">=", value: 0.20 }      # gates.stamina_effort_high_threshold

  # ── apathy (P3): Mood <= -0.60 hides abstraction:med|high ─────────────────
  - id: apathy
    tags: [ "abstraction:med", "abstraction:high" ]
    expr:
      or:
        - { body: Mood, op: ">", value: -0.60 }         # gates.apathy_mood_threshold
        - and:
            - { not: { tag: "abstraction:med" } }
            - { not: { tag: "abstraction:high" } }

  # ── adrenaline (P3): cost discount only (never hides) ─────────────────────
  - id: adrenaline
    tags: [ "effort:high", "risk:high", "violent:low", "violent:med", "violent:high" ]
    cost_rule: { mult: 0.50 }                            # gates.adrenaline_cost_multiplier
    expr:                                                # the multiplier fires iff this is true
      and:
        - { body: Adrenaline, op: ">=", value: 0.70 }
        - or:
            - { tag: "effort:high" }
            - { tag: "risk:high" }
            - { tag: "violent:low" }
            - { tag: "violent:med" }
            - { tag: "violent:high" }
