name: Build and Push bdg-backend

# Simulation writer + read/write API (gapi.dogring.kr), built from backend/Dockerfile.api.
on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - "content/**"
      - "backend/Dockerfile.api"
      - ".dockerignore"
      - ".github/workflows/backend.yaml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - "content/**"
      - "backend/Dockerfile.api"
      - ".dockerignore"
      - ".github/workflows/backend.yaml"

env:
  REGISTRY: registry.dogring.kr
  IMAGE_NAME: bdg-backend
  IMAGE_TAG: 0.1.0

jobs:
  # Race-detector gate: the concurrency introduced by the live-replay/persist
  # hardening (single-writer worldPub, emitter LastStreamID, prune cadence) can
  # only be verified with `-race`, which needs CGO/gcc — unavailable in the dev
  # sandbox, so CI is the sole place it runs. build-and-push is gated on this so
  # a race-failing commit never produces a :latest image Flux would auto-deploy.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test with race detector
        working-directory: backend
        run: go test -race ./...

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Zot Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ZOT_USERNAME }}
          password: ${{ secrets.ZOT_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ env.IMAGE_TAG }}
            type=sha,prefix=,format=short
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile.api
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # ignore-error: a transient 503 from the GHA cache service must not fail an
          # otherwise-successful image build/push (cache export is best-effort).
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Verify Push
        if: github.event_name != 'pull_request'
        run: |
          echo "Pushed tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo ""
          echo "Catalog check:"
          curl -sf -u ${{ secrets.ZOT_USERNAME }}:${{ secrets.ZOT_PASSWORD }} \
            https://${{ env.REGISTRY }}/v2/_catalog | jq .

      - name: Slack message
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: always()
